<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude and Magic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Claude and Magic v1.0 - a first-person dungeon crawler for a party of four, in one file.
  Open it in a browser and play; the Claude Timeline opens it in a window of its own. Your runs and the Hall of Fame
  are kept in this browser (Settings > Export carries them elsewhere). Built from ClaudeGames/claudemagic/src by
  build.py - change the source there, not this file.
-->
<style>
:root {
  --ink: #F0E0B0; --dim: #A09070; --faint: #6A5A40; --gold: #E8C870; --red: #E03030; --blue: #2848C0;
  --wood: #3A2C1C; --wood-light: #5A442A; --edge: #8A6A3A; --night: #18120C; --pit: #0E0A06; --paper: #E8DCC0;
  --serif: Georgia, "Palatino Linotype", "Book Antiqua", serif; --mono: Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); font-family: var(--serif); overflow: hidden; }
body { user-select: none; -webkit-user-select: none; }
#app { height: 100%; display: flex; flex-direction: column; }
.screen { display: none; height: 100%; }
.screen.on { display: flex; }
button { background: var(--wood); color: var(--ink); border: 1px solid var(--edge); padding: 6px 12px; font: bold 13px var(--serif); cursor: pointer; border-radius: 3px; }
button:hover { background: var(--wood-light); }
button:disabled { color: var(--faint); cursor: default; background: var(--wood); }
button.primary { background: #5A3A1A; border-color: var(--gold); }
button.primary:hover { background: #7A5020; }
input[type=text], textarea { background: var(--pit); color: var(--ink); border: 1px solid var(--edge); font: 13px var(--mono); padding: 5px 8px; border-radius: 3px; }
input[type=range] { accent-color: var(--gold); }
kbd { font: 11px var(--mono); background: #2A2018; border: 1px solid var(--edge); border-radius: 3px; padding: 1px 5px; color: var(--gold); }

/* ---- the title ---- */
#title { position: relative; align-items: stretch; }
#title canvas.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; }
#title .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(24,18,12,0.55) 0%, rgba(24,18,12,0.92) 75%); }
#title .sheet { position: relative; margin: auto; width: min(1040px, 96vw); max-height: 100vh; display: grid; grid-template-columns: 1.1fr 0.9fr; grid-template-rows: auto auto auto 1fr auto auto; gap: 10px 24px; padding: 10px 24px 8px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
#title h1 { grid-column: 1 / -1; margin: 2px 0 0; text-align: center; font-size: 42px; line-height: 1.1; color: var(--gold); letter-spacing: 1px; text-shadow: 0 0 18px rgba(232,200,112,0.35), 0 2px 0 #3A2C1C; }
#title .tagline { grid-column: 1 / -1; text-align: center; margin: -6px 0 0; color: var(--dim); font-style: italic; font-size: 14px; }
#title .note { grid-column: 1 / -1; text-align: center; color: var(--ink); font-size: 14px; min-height: 18px; margin-top: -4px; }
.card { background: rgba(14,10,6,0.82); border: 1px solid var(--edge); border-radius: 4px; padding: 10px 14px; }
.card h2 { margin: 0 0 6px; font-size: 14px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px; }
.card p { margin: 5px 0; color: var(--dim); font-size: 12.5px; line-height: 1.4; }
#expedition .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
#expedition .row label { color: var(--dim); font-size: 13px; }
#expedition input { width: 190px; }
#heroes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hero { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: start; background: rgba(42,32,24,0.6); border: 1px solid #4A3A28; border-radius: 3px; padding: 5px 6px; }
.hero canvas { width: 48px; height: 48px; border: 1px solid var(--edge); border-radius: 3px; image-rendering: auto; }
.hero b { color: var(--ink); font-size: 13px; }
.hero small { display: block; color: var(--dim); font-size: 11px; line-height: 1.35; }
.hero .gear { color: #B0A080; font-size: 11px; }
#fame table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
#fame td { padding: 3px 4px; color: var(--ink); white-space: nowrap; }
#fame td.won { color: var(--gold); }
#fame .empty { color: var(--faint); font-style: italic; font-family: var(--serif); }
#title .foot { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 2px; }
#title .version { grid-column: 1 / -1; text-align: center; color: var(--faint); font-size: 11px; margin-top: -4px; }

/* ---- the dungeon ---- */
#play { flex-direction: column; padding: 8px; gap: 8px; }
#play .top { display: flex; gap: 10px; flex: 1 1 auto; min-height: 0; }
#view { position: relative; flex: 1 1 auto; min-width: 320px; border: 3px solid var(--edge); background: #000; overflow: hidden; }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#view .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px 30px rgba(0,0,0,0.55); }
#view .compass { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font: bold 15px var(--serif); color: #E8D8A0; text-shadow: 0 1px 2px #000, 0 0 8px rgba(0,0,0,0.8); pointer-events: none; }
#view .fps { position: absolute; top: 6px; right: 8px; font: 11px var(--mono); color: #9F9; text-shadow: 0 1px 1px #000; display: none; }
#view .fps.on { display: block; }
#view .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font: 14px var(--serif); color: var(--ink); text-shadow: 0 1px 2px #000; pointer-events: none; }
#view .hurt { position: absolute; inset: 0; pointer-events: none; background: rgba(200,30,20,0.35); opacity: 0; transition: opacity 0.25s; }
#view .hurt.on { opacity: 1; transition: none; }
#side { width: 296px; flex: 0 0 296px; display: flex; flex-direction: column; gap: 8px; }
#automap { width: 290px; height: 290px; border: 3px solid var(--edge); background: var(--paper); }
#side .where { font: bold 13px var(--serif); color: var(--gold); text-align: center; }
#side .purse { font: bold 13px var(--serif); color: var(--gold); text-align: center; }
#party { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.member { display: grid; grid-template-columns: 44px 1fr; gap: 6px; border: 2px solid var(--edge); background: #2A2018; padding: 5px; border-radius: 3px; min-height: 74px; }
.member.fallen { background: #2A1010; }
.member canvas { width: 44px; height: 44px; border: 1px solid var(--edge); border-radius: 3px; }
.member.fallen canvas { filter: grayscale(1) brightness(0.5); }
.member .name { font: bold 13px var(--serif); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member.fallen .name { color: #A06060; }
.member .gear { font: 10px Tahoma, Verdana, sans-serif; color: #B0A080; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { position: relative; height: 11px; background: #100C08; margin-top: 3px; border-radius: 2px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); transition: width 0.25s; }
.bar.mp i { background: var(--blue); }
.bar span { position: absolute; inset: 0; text-align: center; font: bold 9px Tahoma, Verdana, sans-serif; color: #fff; line-height: 11px; text-shadow: 0 1px 1px #000; }
#log { height: 118px; flex: 0 0 118px; background: var(--pit); border: 2px solid var(--edge); padding: 4px 8px; font: 12px/15px var(--mono); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
#log div { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#log div:last-child { color: var(--ink); }
#actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* ---- the bag and the merchant ---- */
#bag { flex-direction: column; padding: 14px; gap: 10px; }
#bag h2 { margin: 0; font-size: 18px; color: var(--gold); }
#bag .lists { display: flex; gap: 10px; flex: 1 1 auto; min-height: 0; }
.list { flex: 1 1 0; background: #1A140E; border: 1px solid var(--edge); overflow: auto; font: 13px var(--serif); }
.list .head { position: sticky; top: 0; background: #2A2018; color: var(--gold); padding: 5px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
.list .item { padding: 5px 8px; cursor: pointer; color: var(--ink); }
.list .item:hover { background: #2E241A; }
.list .item.sel { background: var(--wood-light); }
.list .item .what { color: var(--dim); font-size: 12px; }
.list .empty { padding: 10px 8px; color: var(--faint); font-style: italic; }
#bag .note { min-height: 20px; color: var(--ink); font-size: 13px; }
#bag .give, #bag .act { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- dialogs ---- */
.dialog { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10; }
.dialog.on { display: flex; }
.dialog .box { background: #1E160E; border: 2px solid var(--edge); border-radius: 4px; padding: 16px 20px; min-width: 360px; max-width: min(720px, 94vw); max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
.dialog h2 { margin: 0 0 12px; color: var(--gold); font-size: 17px; }
.dialog .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: var(--ink); font-size: 13px; }
.dialog .row label { flex: 1 1 auto; }
.dialog .end { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.dialog textarea { width: 100%; height: 120px; resize: vertical; }
.dialog table.keys { border-collapse: collapse; }
.dialog table.keys td { padding: 3px 10px 3px 0; font-size: 13px; color: var(--ink); }
.dialog table.keys td:first-child { color: var(--gold); white-space: nowrap; }
.dialog .small { color: var(--dim); font-size: 12px; }
#bigmap { background: rgba(0,0,0,0.75); }
#bigmap canvas { border: 4px solid var(--edge); background: var(--paper); }

/* ---- the words rising from a hit ---- */
.float { position: absolute; transform: translate(-50%, -50%); font: bold 18px var(--serif); color: #FFF; text-shadow: 0 0 6px #000, 0 1px 2px #000; pointer-events: none; animation: rise 0.9s ease-out forwards; }
.float.spell { color: #FFB060; }
.float.miss { color: #B0B0B0; font-style: italic; font-size: 14px; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -48px; } }

@media (max-width: 900px) {
  #play .top { flex-direction: column; }
  #side { width: auto; flex: 0 0 auto; flex-direction: row; align-items: center; justify-content: center; }
  #automap { width: 150px; height: 150px; }
  #party { grid-template-columns: repeat(2, 1fr); }
  #title .sheet { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- 00-util.js ----
"use strict";
// Claude and Magic - the shared bits: the version, a seeded random, saving in the browser, small maths.
// Everything the game is lives on window.CM, so the Timeline's tests can reach it with page.runJavaScript.
const CM = window.CM = { version: "1.0", built: "__BUILT__" };

// a 32-bit number from any text (FNV-1a) - a seed word becomes a dungeon
CM.hashSeed = function (text) {
  let h = 2166136261 >>> 0;
  const s = String(text);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
};

// mulberry32: small and fast, and the same dungeon from the same seed in every browser
CM.Random = class {
  constructor(seed) { this.s = (typeof seed === "number" ? seed : CM.hashSeed(seed == null ? Math.random() : seed)) >>> 0; }
  next() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }        // both ends in, like Python's randint
  pick(list) { return list[Math.floor(this.next() * list.length)]; }
  chance(p) { return this.next() < p; }
  shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    return list;
  }
};

// localStorage, which may be missing, full or forbidden (a file opened in a strict browser): never let that stop the game
CM.store = {
  get(key, fallback) {
    try { const v = localStorage.getItem("claudemagic." + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("claudemagic." + key, JSON.stringify(value)); return true; } catch (e) { return false; }
  },
  remove(key) { try { localStorage.removeItem("claudemagic." + key); } catch (e) { /* nothing to remove */ } },
};

CM.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
CM.lerp = (a, b, t) => a + (b - a) * t;
CM.ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);      // in and out
CM.plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

// a seed you can say out loud: "ember-crypt-417"
CM.SEED_WORDS = ["ember", "crypt", "raven", "lantern", "sable", "hollow", "thorn", "cinder", "vesper", "moss", "iron", "gloam",
  "wyrm", "candle", "marrow", "grave", "frost", "amber", "shade", "stone", "echo", "rune", "oath", "dusk"];
CM.randomSeed = function () {
  const r = new CM.Random(Math.floor(Math.random() * 4294967296));
  return `${r.pick(CM.SEED_WORDS)}-${r.pick(CM.SEED_WORDS)}-${r.int(100, 999)}`;
};

CM.today = function () {                       // the Hall of Fame's date, the way the old game wrote it: m/d/yyyy
  const d = new Date();
  return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}/${d.getFullYear()}`;
};

// ---- 10-data.js ----
"use strict";
// What there is: the classes, the gear, the monsters, the depths and what they look like.

CM.DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];              // north, east, south, west (x, y on the grid)
CM.DIR_NAMES = "NESW";
CM.LAST_FLOOR = 20;
CM.CAMP_AFTER = [5, 10, 15];                               // a merchant's camp waits below these floors

CM.CLASSES = {
  Knight: { hp: 34, mp: 0, atk: 6, df: 3, role: "Front line", blurb: "Hits hard and wears the heaviest armour. Takes the blows meant for the others." },
  Rogue: { hp: 24, mp: 0, atk: 5, df: 2, role: "Striker", blurb: "Quick, and one hit in four finds a weak spot for double damage." },
  Cleric: { hp: 26, mp: 12, atk: 4, df: 2, role: "Healer", blurb: "Prays over the most wounded of the party: a heal that grows with every level." },
  Mage: { hp: 18, mp: 14, atk: 3, df: 1, role: "Caster", blurb: "Frail, but a fireball hits every foe at once. Keep the Mage at the back." },
};
CM.CLASS_ORDER = ["Knight", "Rogue", "Cleric", "Mage"];

CM.WEAPONS = ["Dagger", "Short Sword", "Mace", "Long Sword", "Battle Axe", "War Hammer", "Bastard Sword", "Rune Blade",
  "Flamberge", "Mithril Sword", "Dragonslayer", "Claudebrand"];
CM.ARMORS = ["Padded Vest", "Leather Armor", "Studded Leather", "Ring Mail", "Scale Mail", "Chain Mail", "Banded Mail",
  "Plate Mail", "Elven Mail", "Mithril Plate", "Dragon Scale", "Aegis of Claude"];

// each monster, with how it's painted: body (beast, biped, small, wide, tall, ghost), head, eyes, and what it carries
CM.MONSTERS = [
  { name: "Giant Rat", colour: "#8A7058", body: "beast", head: "snout", eyes: "#FF5040", extras: ["tail"] },
  { name: "Kobold", colour: "#B07040", body: "small", head: "snout", eyes: "#FFE040", extras: ["dagger"] },
  { name: "Skeleton", colour: "#E0E0D0", body: "thin", head: "skull", eyes: "#FFE040", extras: ["sword"] },
  { name: "Goblin", colour: "#5A9A40", body: "small", head: "ears", eyes: "#FFE040", extras: ["club"] },
  { name: "Zombie", colour: "#7A9A70", body: "biped", head: "round", eyes: "#D0FFD0", extras: ["torn"] },
  { name: "Orc", colour: "#4A7A3A", body: "wide", head: "tusks", eyes: "#FFE040", extras: ["axe"] },
  { name: "Ghoul", colour: "#9AA0A0", body: "thin", head: "round", eyes: "#80FF80", extras: ["claws"] },
  { name: "Dark Elf", colour: "#5A4A8A", body: "tall", head: "hood", eyes: "#FF80FF", extras: ["bow"] },
  { name: "Troll", colour: "#3A6A50", body: "wide", head: "round", eyes: "#FFE040", extras: ["club", "claws"] },
  { name: "Wraith", colour: "#6A7AA0", body: "ghost", head: "hood", eyes: "#A0E0FF", extras: [] },
  { name: "Ogre", colour: "#A08050", body: "wide", head: "round", eyes: "#FFE040", extras: ["club"] },
  { name: "Minotaur", colour: "#7A4A30", body: "wide", head: "horns", eyes: "#FF5040", extras: ["axe"] },
  { name: "Gargoyle", colour: "#707078", body: "wide", head: "horns", eyes: "#FFE040", extras: ["wings"] },
  { name: "Vampire", colour: "#8A2030", body: "tall", head: "pale", eyes: "#FF3030", extras: ["cape"] },
  { name: "Demon", colour: "#C03020", body: "wide", head: "horns", eyes: "#FFE040", extras: ["wings", "claws"] },
  { name: "Wyvern", colour: "#407A70", body: "beast", head: "snout", eyes: "#FFE040", extras: ["wings", "tail"] },
];
CM.BOSS = { name: "The Lich King", colour: "#A0E0FF", body: "tall", head: "skull", eyes: "#40F0FF", extras: ["crown", "staff", "robe"] };

// the depths: what the stone looks like down there, how far the torch reaches, what the dark is made of
CM.THEMES = [
  { name: "The Catacombs", floors: [1, 5], stone: [118, 104, 88], mortar: [52, 44, 36], floor: [92, 80, 66], ceiling: [60, 52, 44],
    moss: [70, 90, 50], fog: [0.04, 0.03, 0.02], torch: [1.0, 0.82, 0.58], reach: 5.5, bones: 0.25 },
  { name: "The Flooded Vaults", floors: [6, 10], stone: [92, 100, 96], mortar: [38, 44, 42], floor: [60, 72, 70], ceiling: [44, 52, 50],
    moss: [40, 90, 70], fog: [0.02, 0.04, 0.045], torch: [0.9, 0.85, 0.7], reach: 5.0, bones: 0.1 },
  { name: "The Dwarven Halls", floors: [11, 15], stone: [104, 92, 84], mortar: [40, 34, 30], floor: [84, 74, 64], ceiling: [56, 48, 42],
    moss: [120, 90, 50], fog: [0.03, 0.025, 0.02], torch: [1.0, 0.75, 0.45], reach: 6.0, bones: 0.05 },
  { name: "The Lich King's Palace", floors: [16, 20], stone: [78, 84, 100], mortar: [28, 30, 40], floor: [50, 54, 70], ceiling: [36, 38, 52],
    moss: [60, 110, 130], fog: [0.015, 0.025, 0.045], torch: [0.75, 0.85, 1.0], reach: 4.5, bones: 0.4 },
];
CM.themeFor = (number) => CM.THEMES.find((t) => number >= t.floors[0] && number <= t.floors[1]) || CM.THEMES[CM.THEMES.length - 1];
CM.themeIndex = (number) => Math.max(0, CM.THEMES.indexOf(CM.themeFor(number)));

CM.KEYS_HELP = [
  ["W / Up", "forward"], ["S / Down", "back"], ["A / Left", "turn left"], ["D / Right", "turn right"], ["Q / E", "sidestep"],
  ["Space", "use: open a chest, climb down"], ["I", "inventory"], ["Tab", "the automap, large"], ["Esc", "close a screen / pause"],
  ["F", "fight"], ["C", "cast"], ["P", "potion"], ["R", "run"], ["F3", "frames per second"],
];

// ---- 20-world.js ----
"use strict";
// The world: items, a floor's maze with its chests, monsters and ladder, monster groups, a new party.
// Pure functions of a Random, so a seed gives the same dungeon every time (and the tests can check thousands).

CM.makeItem = function (floor, rnd, kind) {
  kind = kind || rnd.pick(["weapon", "weapon", "armor", "armor", "potion", "potion", "potion"]);
  if (kind === "potion") {
    const roll = rnd.next();
    if (roll < 0.12) return { name: "Phoenix Feather", kind: "revive", power: 0, value: 120 };
    if (roll < 0.4) return { name: "Mana Potion", kind: "mana", power: 12 + floor, value: 25 };
    return { name: "Healing Potion", kind: "heal", power: 20 + floor * 3, value: 20 };
  }
  const tier = CM.clamp(Math.floor((floor + rnd.int(-2, 2)) * 12 / 21), 0, 11);
  const names = kind === "weapon" ? CM.WEAPONS : CM.ARMORS;
  const power = (tier + 1) * (kind === "weapon" ? 2 : 1) + rnd.int(0, 2);
  const bonus = rnd.chance(0.15);
  return { name: names[tier] + (bonus ? " +1" : ""), kind, power: power + (bonus ? 2 : 0),
    value: 15 * (tier + 1) * (tier + 1) + (bonus ? 40 : 0) };
};

CM.monsterGroup = function (floor, rnd) {
  const top = Math.min(CM.MONSTERS.length - 1, Math.floor(floor * CM.MONSTERS.length / CM.LAST_FLOOR));
  const kind = CM.MONSTERS[rnd.int(Math.max(0, top - 2), top)];
  const count = rnd.int(1, 2 + Math.floor(floor / 6));
  const level = floor;
  const group = [];
  for (let i = 0; i < count; i++) {
    group.push({ name: kind.name, colour: kind.colour, hp: 8 + level * 6, max: 8 + level * 6, atk: 3 + level * 2, df: level,
      xp: 10 + level * 8, gold: rnd.int(2, 8) * level });
  }
  return group;
};

CM.bossMonster = () => ({ name: CM.BOSS.name, colour: CM.BOSS.colour, hp: 650, max: 650, atk: 46, df: 18, xp: 5000, gold: 5000, boss: true });

// how far every open square is from the start (a breadth-first walk)
CM.distances = function (grid, start) {
  const key = (x, y) => `${x},${y}`;
  const dist = new Map([[key(start[0], start[1]), 0]]);
  const queue = [start];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    for (const [dx, dy] of CM.DIRS) {
      const nx = x + dx, ny = y + dy;
      if (ny >= 0 && ny < grid.length && nx >= 0 && nx < grid[0].length && grid[ny][nx] === 0 && !dist.has(key(nx, ny))) {
        dist.set(key(nx, ny), dist.get(key(x, y)) + 1);
        queue.push([nx, ny]);
      }
    }
  }
  return dist;
};

// A floor: a maze (recursive backtracker, with some extra openings so it isn't perfect), the start, the ladder on the
// open square furthest from it (or the Lich King, on the last), chests and monsters on the way.
CM.makeFloor = function (number, seed) {
  const rnd = new CM.Random(CM.hashSeed(`${seed}:floor:${number}`));
  const size = Math.min(17 + Math.floor(number / 4) * 2, 27);
  const grid = [];
  for (let y = 0; y < size; y++) grid.push(new Array(size).fill(1));
  const stack = [[1, 1]];
  grid[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const options = CM.DIRS.filter(([dx, dy]) => x + dx * 2 > 0 && x + dx * 2 < size - 1 && y + dy * 2 > 0 && y + dy * 2 < size - 1
      && grid[y + dy * 2][x + dx * 2] === 1);
    if (!options.length) { stack.pop(); continue; }
    const [dx, dy] = rnd.pick(options);
    grid[y + dy][x + dx] = 0;
    grid[y + dy * 2][x + dx * 2] = 0;
    stack.push([x + dx * 2, y + dy * 2]);
  }
  for (let i = 0; i < Math.floor(size * size / 14); i++) {                // loops, so there's more than one way round
    const x = rnd.int(1, size - 2), y = rnd.int(1, size - 2);
    if (grid[y][x] === 1 && ((grid[y][x - 1] === 0 && grid[y][x + 1] === 0) || (grid[y - 1][x] === 0 && grid[y + 1][x] === 0))) grid[y][x] = 0;
  }
  const start = [1, 1];
  const dist = CM.distances(grid, start);
  let far = start, best = -1;
  for (const [k, d] of dist) if (d > best) { best = d; far = k.split(",").map(Number); }
  const things = {};
  const spare = [];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (grid[y][x] === 0 && !(x === 1 && y === 1) && !(x === far[0] && y === far[1]) && (dist.get(`${x},${y}`) || 0) > 3) spare.push([x, y]);
  }
  rnd.shuffle(spare);
  for (let i = 0; i < 3 + Math.floor(number / 4) && spare.length; i++) {
    const [x, y] = spare.pop();
    const items = [];
    const n = rnd.int(1, 2);
    for (let j = 0; j < n; j++) items.push(CM.makeItem(number, rnd));
    things[`${x},${y}`] = { type: "chest", gold: rnd.int(10, 30) * number, items };
  }
  for (let i = 0; i < 5 + Math.floor(number / 2) && spare.length; i++) {
    const [x, y] = spare.pop();
    things[`${x},${y}`] = { type: "monsters", group: CM.monsterGroup(number, rnd) };
  }
  things[`${far[0]},${far[1]}`] = number === CM.LAST_FLOOR ? { type: "boss", group: [CM.bossMonster()] } : { type: "ladder" };
  return { number, grid, pos: [1, 1], facing: grid[2][1] === 0 ? 2 : 1, things, seen: [] };
};

// can the party get from the start to the ladder (or the Lich King)? - what the tests ask of every floor
CM.solvable = function (floor) {
  const dist = CM.distances(floor.grid, [1, 1]);
  const goal = Object.entries(floor.things).find(([, t]) => t.type === "ladder" || t.type === "boss");
  return Boolean(goal) && dist.has(goal[0]);
};

CM.newParty = function () {
  return CM.CLASS_ORDER.map((cls) => {
    const s = CM.CLASSES[cls];
    return { name: cls, cls, level: 1, xp: 0, hp: s.hp, max: s.hp, mp: s.mp, maxmp: s.mp, atk: s.atk, df: s.df,
      weapon: { name: cls === "Mage" || cls === "Cleric" ? "Staff" : "Club", kind: "weapon", power: 1, value: 5 },
      armor: { name: cls === "Mage" ? "Robes" : "Tunic", kind: "armor", power: 0, value: 5 } };
  });
};

CM.startingBag = (seed) => {
  const rnd = new CM.Random(CM.hashSeed(`${seed}:bag`));
  return [CM.makeItem(1, rnd, "potion"), CM.makeItem(1, rnd, "potion")];
};

// ---- 30-art.js ----
"use strict";
// Everything the game shows is painted here in code - the stone of each depth, the chests and hatches, every
// monster, the heroes' portraits - so the one file carries no pictures. Textures and sprites are 256 x 256 and go to
// the renderer as the layers of one texture array; CM.art.build(theme) returns {layers: [canvas...], index: {name: n}}.
CM.art = {};
const ART_SIZE = 256;

function artCanvas(size = ART_SIZE) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  return c;
}

function rgb([r, g, b], k = 1, a = 1) {
  return `rgba(${Math.round(CM.clamp(r * k, 0, 255))},${Math.round(CM.clamp(g * k, 0, 255))},${Math.round(CM.clamp(b * k, 0, 255))},${a})`;
}

function speckle(p, rnd, w, h, n, colour, alpha, size = 2) {           // grain on stone
  p.fillStyle = colour;
  p.globalAlpha = alpha;
  for (let i = 0; i < n; i++) p.fillRect(rnd.next() * w, rnd.next() * h, size * (0.5 + rnd.next()), size * (0.5 + rnd.next()));
  p.globalAlpha = 1;
}

function crack(p, rnd, x, y, length, colour) {
  p.strokeStyle = colour;
  p.lineWidth = 1.5;
  p.beginPath();
  p.moveTo(x, y);
  let a = rnd.next() * Math.PI * 2;
  for (let i = 0; i < length; i += 6) {
    a += (rnd.next() - 0.5) * 1.2;
    x += Math.cos(a) * 6;
    y += Math.sin(a) * 6;
    p.lineTo(x, y);
  }
  p.stroke();
}

function bone(p, rnd, x, y, k) {                                      // a bone, or a skull, set into the wall
  p.save();
  p.translate(x, y);
  p.rotate((rnd.next() - 0.5) * 1.2);
  p.fillStyle = "#D8D0B8";
  p.strokeStyle = "#5A5040";
  p.lineWidth = 1.5;
  if (k < 0.5) {
    p.fillRect(-14, -3, 28, 6);
    p.strokeRect(-14, -3, 28, 6);
    for (const sx of [-14, 14]) { p.beginPath(); p.arc(sx, -3, 4, 0, Math.PI * 2); p.arc(sx, 3, 4, 0, Math.PI * 2); p.fill(); p.stroke(); }
  } else {
    p.beginPath(); p.arc(0, -2, 11, 0, Math.PI * 2); p.fill(); p.stroke();
    p.fillRect(-7, 5, 14, 7); p.strokeRect(-7, 5, 14, 7);
    p.fillStyle = "#201810";
    p.beginPath(); p.arc(-4, -3, 3, 0, Math.PI * 2); p.arc(4, -3, 3, 0, Math.PI * 2); p.fill();
  }
  p.restore();
}

// ---- the stone ---------------------------------------------------------------------------------------------------
CM.art.wall = function (theme, seed, bones) {
  const c = artCanvas(), p = c.getContext("2d"), rnd = new CM.Random(seed), S = ART_SIZE;
  p.fillStyle = rgb(theme.mortar);
  p.fillRect(0, 0, S, S);
  const rows = 4, rowH = S / rows, cols = 3, mortar = 5;
  for (let r = 0; r < rows; r++) {
    const offset = r % 2 ? S / cols / 2 : 0;
    for (let col = -1; col <= cols; col++) {
      const x = col * (S / cols) + offset, y = r * rowH;
      const k = 0.82 + rnd.next() * 0.36;
      const g = p.createLinearGradient(x, y, x, y + rowH);
      g.addColorStop(0, rgb(theme.stone, k * 1.08));
      g.addColorStop(1, rgb(theme.stone, k * 0.86));
      p.fillStyle = g;
      p.fillRect(x + mortar / 2, y + mortar / 2, S / cols - mortar, rowH - mortar);
      p.strokeStyle = rgb(theme.stone, k * 1.25, 0.5);                 // a lit top edge
      p.lineWidth = 1.5;
      p.beginPath(); p.moveTo(x + mortar / 2, y + mortar / 2 + 1); p.lineTo(x + S / cols - mortar / 2, y + mortar / 2 + 1); p.stroke();
      p.strokeStyle = rgb(theme.mortar, 0.7, 0.6);                      // a shadowed bottom edge
      p.beginPath(); p.moveTo(x + mortar / 2, y + rowH - mortar / 2 - 1); p.lineTo(x + S / cols - mortar / 2, y + rowH - mortar / 2 - 1); p.stroke();
    }
  }
  speckle(p, rnd, S, S, 900, rgb(theme.stone, 0.55), 0.35);
  speckle(p, rnd, S, S, 500, rgb(theme.stone, 1.5), 0.2);
  for (let i = 0; i < 3; i++) crack(p, rnd, rnd.next() * S, rnd.next() * S, 30 + rnd.next() * 50, rgb(theme.mortar, 0.6, 0.8));
  p.globalAlpha = 0.45;                                                 // moss creeping in from the corners
  for (let i = 0; i < 5; i++) {
    const x = rnd.pick([0, S]) + (rnd.next() - 0.5) * 60, y = rnd.next() * S;
    const g = p.createRadialGradient(x, y, 0, x, y, 26 + rnd.next() * 30);
    g.addColorStop(0, rgb(theme.moss, 1, 0.8)); g.addColorStop(1, rgb(theme.moss, 1, 0));
    p.fillStyle = g; p.fillRect(0, 0, S, S);
  }
  p.globalAlpha = 1;
  if (bones) for (let i = 0; i < 2 + rnd.int(0, 2); i++) bone(p, rnd, 30 + rnd.next() * (S - 60), 30 + rnd.next() * (S - 60), rnd.next());
  return c;
};

CM.art.floor = function (theme, seed) {
  const c = artCanvas(), p = c.getContext("2d"), rnd = new CM.Random(seed), S = ART_SIZE;
  p.fillStyle = rgb(theme.mortar, 0.9);
  p.fillRect(0, 0, S, S);
  const n = 4, cell = S / n;
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
    const k = 0.8 + rnd.next() * 0.4, gap = 4 + rnd.next() * 3;
    p.fillStyle = rgb(theme.floor, k);
    const x = col * cell + gap / 2, y = r * cell + gap / 2, w = cell - gap, h = cell - gap;
    p.beginPath();                                                      // a flagstone, a little irregular
    p.moveTo(x + rnd.next() * 6, y + rnd.next() * 6);
    p.lineTo(x + w - rnd.next() * 6, y + rnd.next() * 6);
    p.lineTo(x + w - rnd.next() * 6, y + h - rnd.next() * 6);
    p.lineTo(x + rnd.next() * 6, y + h - rnd.next() * 6);
    p.closePath(); p.fill();
  }
  speckle(p, rnd, S, S, 1200, rgb(theme.floor, 0.5), 0.3);
  speckle(p, rnd, S, S, 400, rgb(theme.floor, 1.4), 0.2);
  if (theme.name.includes("Flooded")) {                                 // standing water
    for (let i = 0; i < 3; i++) {
      const x = rnd.next() * S, y = rnd.next() * S, rad = 30 + rnd.next() * 40;
      const g = p.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, "rgba(60,110,140,0.75)"); g.addColorStop(1, "rgba(60,110,140,0)");
      p.fillStyle = g; p.fillRect(0, 0, S, S);
    }
  }
  return c;
};

CM.art.ceiling = function (theme, seed) {
  const c = artCanvas(), p = c.getContext("2d"), rnd = new CM.Random(seed), S = ART_SIZE;
  p.fillStyle = rgb(theme.ceiling);
  p.fillRect(0, 0, S, S);
  speckle(p, rnd, S, S, 1500, rgb(theme.ceiling, 0.6), 0.4, 3);
  speckle(p, rnd, S, S, 500, rgb(theme.ceiling, 1.4), 0.25, 2);
  for (let i = 0; i < 4; i++) crack(p, rnd, rnd.next() * S, rnd.next() * S, 40 + rnd.next() * 60, rgb(theme.ceiling, 0.4, 0.9));
  return c;
};

// ---- things ------------------------------------------------------------------------------------------------------
CM.art.chest = function () {
  const c = artCanvas(), p = c.getContext("2d"), S = ART_SIZE;
  const w = 150, h = 70, x = (S - w) / 2, y = S - 20 - h;
  p.fillStyle = "rgba(0,0,0,0.35)";                                      // its shadow on the floor
  p.beginPath(); p.ellipse(S / 2, S - 18, w / 2 + 6, 10, 0, 0, Math.PI * 2); p.fill();
  p.fillStyle = "#6E4420"; p.fillRect(x, y, w, h);                     // the box
  p.fillStyle = "#8A5A2A"; p.fillRect(x, y - 30, w, 34);               // the lid
  p.fillStyle = "#5A3618";
  for (const bx of [x + 14, x + w / 2 - 5, x + w - 24]) p.fillRect(bx, y - 30, 10, h + 34);   // the planks' bands
  p.fillStyle = "#3A2410";
  for (let i = 1; i < 4; i++) p.fillRect(x, y + i * (h / 4), w, 2);
  p.strokeStyle = "#2A1A08"; p.lineWidth = 3; p.strokeRect(x, y - 30, w, h + 34);
  p.fillStyle = "#D8B040"; p.fillRect(S / 2 - 12, y - 6, 24, 26);       // the lock
  p.fillStyle = "#2A1A08"; p.fillRect(S / 2 - 3, y + 4, 6, 10);
  p.strokeStyle = "#D8B040"; p.lineWidth = 3;                           // the hinges' glint
  p.beginPath(); p.moveTo(x + 4, y - 26); p.lineTo(x + w - 4, y - 26); p.stroke();
  return c;
};

CM.art.hatch = function (theme) {                                       // a ladder down: a hole in the floor, seen from above
  const c = artCanvas(), p = c.getContext("2d"), S = ART_SIZE;
  p.fillStyle = rgb(theme.floor, 0.9); p.fillRect(0, 0, S, S);
  p.fillStyle = rgb(theme.floor, 1.2); p.fillRect(28, 28, S - 56, S - 56);   // a stone rim
  p.fillStyle = "#050403"; p.fillRect(40, 40, S - 80, S - 80);              // the dark
  const g = p.createLinearGradient(40, 40, S - 40, S - 40);
  g.addColorStop(0, "rgba(90,70,40,0.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
  p.fillStyle = g; p.fillRect(40, 40, S - 80, S - 80);
  p.strokeStyle = "#A07840"; p.lineWidth = 9;                               // the ladder's rails and rungs
  p.beginPath(); p.moveTo(84, 40); p.lineTo(84, S - 40); p.moveTo(S - 84, 40); p.lineTo(S - 84, S - 40); p.stroke();
  p.lineWidth = 7;
  for (let y = 62; y < S - 44; y += 30) { p.beginPath(); p.moveTo(84, y); p.lineTo(S - 84, y); p.stroke(); }
  p.strokeStyle = "#1A1208"; p.lineWidth = 4; p.strokeRect(40, 40, S - 80, S - 80);
  return c;
};

// ---- monsters: one painter, many creatures ----------------------------------------------------------------------
function outlined(p, draw, fill, line = "#1A1410", width = 3) {
  p.fillStyle = fill; p.strokeStyle = line; p.lineWidth = width; p.lineJoin = "round";
  p.beginPath(); draw(); p.closePath(); p.fill(); p.stroke();
}

function shaded(p, hex, k) {                                            // a colour lighter (k > 1) or darker
  const v = parseInt(hex.slice(1), 16);
  return rgb([(v >> 16) & 255, (v >> 8) & 255, v & 255], k);
}

CM.art.monster = function (m, big = false) {
  const c = artCanvas(), p = c.getContext("2d"), S = ART_SIZE, cx = S / 2, ground = S - 14;
  const col = m.colour, dark = shaded(p, col, 0.65), light = shaded(p, col, 1.3);
  const bodies = { beast: [150, 70], small: [66, 76], biped: [84, 100], thin: [58, 100], wide: [130, 112], tall: [78, 140], ghost: [90, 140] };
  const [bw, bh] = bodies[m.body] || bodies.biped;
  const scale = big ? 1.12 : 1;
  p.translate(cx, ground); p.scale(scale, scale); p.translate(-cx, -ground);
  const bodyTop = ground - (m.body === "beast" ? 24 : 36) - bh, bodyBottom = bodyTop + bh;
  const headR = m.body === "small" ? 30 : m.body === "wide" ? 28 : m.body === "beast" ? 26 : 24;
  const headY = m.body === "beast" ? bodyTop + 4 : bodyTop - headR + 8;
  const ex = m.extras || [];
  p.fillStyle = "rgba(0,0,0,0.35)";                                     // the shadow on the floor
  p.beginPath(); p.ellipse(cx, ground - 2, bw / 2 + 10, 9, 0, 0, Math.PI * 2); p.fill();
  if (ex.includes("wings")) {
    for (const side of [-1, 1]) {
      outlined(p, () => {
        p.moveTo(cx + side * bw * 0.3, bodyTop + 20); p.lineTo(cx + side * (bw * 0.5 + 70), bodyTop - 40);
        p.lineTo(cx + side * (bw * 0.5 + 76), bodyTop + 10); p.lineTo(cx + side * (bw * 0.5 + 44), bodyTop + 2);
        p.lineTo(cx + side * (bw * 0.5 + 56), bodyTop + 50); p.lineTo(cx + side * (bw * 0.5 + 20), bodyTop + 36);
      }, dark);
    }
  }
  if (ex.includes("cape")) outlined(p, () => { p.moveTo(cx - bw * 0.6, bodyTop + 10); p.lineTo(cx + bw * 0.6, bodyTop + 10); p.lineTo(cx + bw * 0.75, ground); p.lineTo(cx - bw * 0.75, ground); }, "#2A1018");
  // legs (not for ghosts: they float)
  if (m.body !== "ghost") {
    const legW = m.body === "beast" ? 16 : Math.max(14, bw * 0.2), legs = m.body === "beast" ? [-0.4, -0.15, 0.15, 0.4] : [-0.25, 0.25];
    for (const f of legs) outlined(p, () => { p.rect(cx + f * bw - legW / 2, bodyBottom - 10, legW, ground - bodyBottom + 10); }, dark);
  }
  // the body
  if (m.body === "ghost") {
    const g = p.createLinearGradient(0, bodyTop, 0, ground);
    g.addColorStop(0, col); g.addColorStop(0.7, dark); g.addColorStop(1, "rgba(0,0,0,0)");
    p.fillStyle = g; p.beginPath();
    p.moveTo(cx - bw / 2, bodyTop + 30); p.quadraticCurveTo(cx, bodyTop - 20, cx + bw / 2, bodyTop + 30); p.lineTo(cx + bw / 2 + 10, ground - 30);
    for (let i = 4; i >= -4; i--) p.lineTo(cx + i * (bw / 8), ground - (i % 2 ? 10 : 34));
    p.lineTo(cx - bw / 2 - 10, ground - 30); p.closePath(); p.fill();
  } else if (m.body === "beast") {
    outlined(p, () => { p.ellipse(cx, bodyTop + bh / 2, bw / 2, bh / 2, 0, 0, Math.PI * 2); }, col);
  } else {
    const g = p.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
    g.addColorStop(0, light); g.addColorStop(0.5, col); g.addColorStop(1, dark);
    outlined(p, () => {
      if (ex.includes("robe") || m.body === "tall") { p.moveTo(cx - bw / 2, bodyTop + 10); p.lineTo(cx + bw / 2, bodyTop + 10); p.lineTo(cx + bw / 2 + 12, ground); p.lineTo(cx - bw / 2 - 12, ground); }
      else p.roundRect(cx - bw / 2, bodyTop, bw, bh, 18);
    }, g);
    if (m.head === "skull" || ex.includes("torn")) {                     // ribs, or rags
      p.strokeStyle = m.head === "skull" ? "#1A1410" : dark; p.lineWidth = 3;
      for (let i = 1; i <= 4; i++) { const y = bodyTop + 14 + i * 16; p.beginPath(); p.moveTo(cx - bw * 0.35, y); p.quadraticCurveTo(cx, y + 8, cx + bw * 0.35, y); p.stroke(); }
    }
  }
  // arms and what they hold
  if (m.body !== "beast" && m.body !== "ghost") {
    const armW = Math.max(14, bw * 0.17), armLen = ex.includes("claws") ? bh * 0.8 : bh * 0.6;
    for (const side of [-1, 1]) {
      outlined(p, () => { p.roundRect(cx + side * (bw / 2 + 2) - (side < 0 ? armW : 0), bodyTop + 16, armW, armLen, 8); }, dark);
      if (ex.includes("claws")) {
        p.strokeStyle = "#E8E8E0"; p.lineWidth = 3;
        for (let i = -1; i <= 1; i++) { const x = cx + side * (bw / 2 + armW / 2 + 2) + i * 6; p.beginPath(); p.moveTo(x, bodyTop + 16 + armLen); p.lineTo(x + i * 2, bodyTop + 16 + armLen + 18); p.stroke(); }
      }
    }
    const hx = cx + bw / 2 + armW / 2 + 2, hy = bodyTop + 16 + armLen;
    p.lineCap = "round";
    if (ex.includes("sword") || ex.includes("dagger")) {
      const len = ex.includes("sword") ? 80 : 44;
      p.strokeStyle = "#1A1410"; p.lineWidth = 9; p.beginPath(); p.moveTo(hx, hy); p.lineTo(hx + 10, hy - len); p.stroke();
      p.strokeStyle = "#E8ECF4"; p.lineWidth = 5; p.beginPath(); p.moveTo(hx, hy); p.lineTo(hx + 10, hy - len); p.stroke();
      p.strokeStyle = "#8A6A20"; p.lineWidth = 5; p.beginPath(); p.moveTo(hx - 8, hy - 8); p.lineTo(hx + 10, hy - 2); p.stroke();
    } else if (ex.includes("club")) {
      p.strokeStyle = "#1A1410"; p.lineWidth = 12; p.beginPath(); p.moveTo(hx, hy); p.lineTo(hx + 14, hy - 70); p.stroke();
      p.strokeStyle = "#7A5A30"; p.lineWidth = 8; p.beginPath(); p.moveTo(hx, hy); p.lineTo(hx + 14, hy - 70); p.stroke();
      outlined(p, () => { p.ellipse(hx + 16, hy - 76, 14, 20, 0.2, 0, Math.PI * 2); }, "#6A4A28");
    } else if (ex.includes("axe")) {
      p.strokeStyle = "#1A1410"; p.lineWidth = 9; p.beginPath(); p.moveTo(hx, hy); p.lineTo(hx + 8, hy - 86); p.stroke();
      p.strokeStyle = "#6A4A28"; p.lineWidth = 5; p.beginPath(); p.moveTo(hx, hy); p.lineTo(hx + 8, hy - 86); p.stroke();
      outlined(p, () => { p.moveTo(hx + 6, hy - 84); p.lineTo(hx + 40, hy - 96); p.lineTo(hx + 40, hy - 50); p.lineTo(hx + 8, hy - 58); }, "#C8CCD4");
    } else if (ex.includes("bow")) {
      p.strokeStyle = "#1A1410"; p.lineWidth = 8; p.beginPath(); p.arc(hx + 6, hy - 30, 46, -1.2, 1.2); p.stroke();
      p.strokeStyle = "#8A6A30"; p.lineWidth = 4; p.beginPath(); p.arc(hx + 6, hy - 30, 46, -1.2, 1.2); p.stroke();
      p.strokeStyle = "#E8E8E0"; p.lineWidth = 1.5; p.beginPath(); p.moveTo(hx + 6 + 46 * Math.cos(-1.2), hy - 30 + 46 * Math.sin(-1.2)); p.lineTo(hx + 6 + 46 * Math.cos(1.2), hy - 30 + 46 * Math.sin(1.2)); p.stroke();
    } else if (ex.includes("staff")) {
      p.strokeStyle = "#1A1410"; p.lineWidth = 10; p.beginPath(); p.moveTo(hx, ground); p.lineTo(hx + 4, bodyTop - 50); p.stroke();
      p.strokeStyle = "#4A3A5A"; p.lineWidth = 6; p.beginPath(); p.moveTo(hx, ground); p.lineTo(hx + 4, bodyTop - 50); p.stroke();
      const g = p.createRadialGradient(hx + 4, bodyTop - 58, 0, hx + 4, bodyTop - 58, 22);
      g.addColorStop(0, m.eyes); g.addColorStop(0.5, shaded(p, m.eyes, 0.6)); g.addColorStop(1, "rgba(0,0,0,0)");
      p.fillStyle = g; p.beginPath(); p.arc(hx + 4, bodyTop - 58, 22, 0, Math.PI * 2); p.fill();
    }
  }
  if (ex.includes("tail")) {
    p.strokeStyle = "#1A1410"; p.lineWidth = 9; p.lineCap = "round";
    p.beginPath(); p.moveTo(cx + bw / 2 - 10, bodyBottom - 20); p.quadraticCurveTo(cx + bw / 2 + 50, bodyBottom - 10, cx + bw / 2 + 56, bodyTop); p.stroke();
    p.strokeStyle = dark; p.lineWidth = 5; p.stroke();
  }
  // the head
  const hy2 = headY, hx2 = cx;
  const faceCol = m.head === "skull" ? "#E8E4D8" : m.head === "pale" ? "#E8D8D0" : m.head === "hood" ? "#1A1420" : col;
  if (m.head === "hood") {
    outlined(p, () => { p.moveTo(hx2, hy2 - headR - 26); p.lineTo(hx2 + headR + 14, hy2 + headR); p.lineTo(hx2 - headR - 14, hy2 + headR); }, dark);
    outlined(p, () => { p.ellipse(hx2, hy2 + 4, headR * 0.8, headR * 0.9, 0, 0, Math.PI * 2); }, faceCol, "#0A080C", 2);
  } else {
    if (m.head === "horns") for (const side of [-1, 1]) outlined(p, () => { p.moveTo(hx2 + side * headR * 0.5, hy2 - headR * 0.6); p.quadraticCurveTo(hx2 + side * headR * 1.6, hy2 - headR * 1.2, hx2 + side * headR * 1.1, hy2 - headR * 2.0); p.lineTo(hx2 + side * headR * 0.9, hy2 - headR * 0.9); }, "#E8E0C8");
    if (m.head === "ears") for (const side of [-1, 1]) outlined(p, () => { p.moveTo(hx2 + side * headR * 0.6, hy2 - headR * 0.3); p.lineTo(hx2 + side * headR * 1.9, hy2 - headR * 1.0); p.lineTo(hx2 + side * headR * 0.8, hy2 + headR * 0.3); }, col);
    if (m.head === "pale") outlined(p, () => { p.ellipse(hx2, hy2 - 6, headR + 4, headR, 0, Math.PI, Math.PI * 2); }, "#1A1014");
    outlined(p, () => { p.ellipse(hx2, hy2, headR, headR * (m.head === "skull" ? 1.05 : 0.95), 0, 0, Math.PI * 2); }, faceCol);
    if (m.head === "snout") outlined(p, () => { p.ellipse(hx2, hy2 + headR * 0.55, headR * 0.7, headR * 0.45, 0, 0, Math.PI * 2); }, light);
    if (m.head === "tusks") for (const side of [-1, 1]) outlined(p, () => { p.moveTo(hx2 + side * headR * 0.5, hy2 + headR * 0.5); p.lineTo(hx2 + side * headR * 0.7, hy2 + headR * 1.05); p.lineTo(hx2 + side * headR * 0.25, hy2 + headR * 0.6); }, "#F0ECE0", "#1A1410", 2);
    if (m.head === "skull") {
      p.fillStyle = "#1A1410";
      for (const side of [-1, 1]) { p.beginPath(); p.ellipse(hx2 + side * headR * 0.42, hy2 - 2, headR * 0.3, headR * 0.34, 0, 0, Math.PI * 2); p.fill(); }
      p.beginPath(); p.moveTo(hx2, hy2 + 6); p.lineTo(hx2 - 5, hy2 + 16); p.lineTo(hx2 + 5, hy2 + 16); p.fill();
      p.fillRect(hx2 - headR * 0.5, hy2 + headR * 0.55, headR, 5);
      p.fillStyle = "#E8E4D8";
      for (let i = -3; i <= 3; i++) p.fillRect(hx2 + i * 6 - 2, hy2 + headR * 0.55, 4, 6);
    }
  }
  // the eyes: they glow
  const eyeY = m.head === "hood" ? hy2 + 2 : hy2 - (m.head === "snout" ? 6 : 2), eyeDX = headR * 0.42, eyeR = headR * (m.head === "skull" ? 0.18 : 0.14);
  p.save();
  p.shadowColor = m.eyes; p.shadowBlur = 14;
  p.fillStyle = m.eyes;
  for (const side of [-1, 1]) { p.beginPath(); p.arc(hx2 + side * eyeDX, eyeY, eyeR, 0, Math.PI * 2); p.fill(); }
  p.restore();
  if (ex.includes("crown")) {
    outlined(p, () => {
      const top = hy2 - headR - 2;
      p.moveTo(hx2 - headR * 0.9, top + 10);
      for (let i = 0; i <= 4; i++) { p.lineTo(hx2 - headR * 0.9 + i * headR * 0.45, top - (i % 2 ? 14 : 26)); }
      p.lineTo(hx2 + headR * 0.9, top + 10);
    }, "#F0C030", "#6A4A08", 2);
  }
  return c;
};

// ---- the heroes' portraits ----------------------------------------------------------------------------------------
CM.art.portrait = function (cls, size = 56) {
  const c = artCanvas(size), p = c.getContext("2d"), s = size / 56;
  p.scale(s, s);
  p.fillStyle = { Knight: "#3A3E4A", Rogue: "#2E3A2A", Cleric: "#4A3E2A", Mage: "#2E2A4A" }[cls] || "#333";
  p.fillRect(0, 0, 56, 56);
  const skin = "#E0B890";
  p.fillStyle = { Knight: "#8A9098", Rogue: "#3A4A30", Cleric: "#E8E0D0", Mage: "#4A3A8A" }[cls];
  p.fillRect(8, 36, 40, 24);                                            // shoulders
  if (cls === "Knight") {
    outlined(p, () => { p.roundRect(14, 8, 28, 32, 8); }, "#B8BEC8", "#2A2E36", 2);
    p.fillStyle = "#1A1C22"; p.fillRect(16, 22, 24, 5);                 // the visor's slit
    p.fillStyle = "#C83030"; p.fillRect(26, 2, 4, 10);                  // a plume
  } else if (cls === "Rogue") {
    outlined(p, () => { p.moveTo(28, 4); p.lineTo(46, 30); p.lineTo(46, 42); p.lineTo(10, 42); p.lineTo(10, 30); }, "#2A3A22", "#101810", 2);
    p.fillStyle = skin; p.fillRect(20, 24, 16, 10);
    p.fillStyle = "#FFE040"; p.fillRect(22, 27, 4, 3); p.fillRect(30, 27, 4, 3);
    p.fillStyle = "#4A2A1A"; p.fillRect(18, 34, 20, 8);                 // a scarf
  } else if (cls === "Cleric") {
    outlined(p, () => { p.arc(28, 24, 14, 0, Math.PI * 2); }, skin, "#5A3A20", 2);
    p.fillStyle = "#E8C040"; p.fillRect(14, 12, 28, 3);                 // a circlet
    p.fillStyle = "#3A2A1A"; p.fillRect(22, 21, 3, 3); p.fillRect(31, 21, 3, 3);
    p.fillStyle = "#E8C040"; p.fillRect(26, 40, 4, 14); p.fillRect(21, 44, 14, 4);   // a holy symbol
  } else {
    outlined(p, () => { p.moveTo(28, 0); p.lineTo(44, 26); p.lineTo(12, 26); }, "#4A3A9A", "#201848", 2);
    p.fillStyle = "#5A4AB0"; p.fillRect(8, 24, 40, 4);                  // the brim
    outlined(p, () => { p.arc(28, 34, 10, 0, Math.PI * 2); }, skin, "#5A3A20", 2);
    p.fillStyle = "#D0D0D8"; p.fillRect(20, 40, 16, 12);                // a beard
    p.fillStyle = "#3A2A1A"; p.fillRect(23, 32, 3, 3); p.fillRect(30, 32, 3, 3);
  }
  return c;
};

// the window's icon, for the browser tab
CM.art.icon = function () {
  const c = artCanvas(32), p = c.getContext("2d");
  p.fillStyle = "#1A1410"; p.fillRect(1, 1, 30, 30);
  p.fillStyle = "#6A5A48";
  p.beginPath(); p.moveTo(1, 1); p.lineTo(10, 8); p.lineTo(10, 24); p.lineTo(1, 31); p.fill();
  p.beginPath(); p.moveTo(31, 1); p.lineTo(22, 8); p.lineTo(22, 24); p.lineTo(31, 31); p.fill();
