// ---- the whole set for a depth, as texture-array layers -------------------------------------------------------------
CM.art.build = function (theme) {
  const layers = [], index = {};
  const add = (name, canvas) => { index[name] = layers.length; layers.push(canvas); };
  const seed = CM.hashSeed(theme.name);
  add("wall", CM.art.wall(theme, seed + 1, false));
  add("wall2", CM.art.wall(theme, seed + 2, false));
  add("wallbones", CM.art.wall(theme, seed + 3, true));
  add("floor", CM.art.floor(theme, seed + 4));
  add("ceiling", CM.art.ceiling(theme, seed + 5));
  add("chest", CM.art.chest());
  add("hatch", CM.art.hatch(theme));
  for (const m of CM.MONSTERS) add(`monster:${m.name}`, CM.art.monster(m));
  add(`monster:${CM.BOSS.name}`, CM.art.monster(CM.BOSS, true));
  return { layers, index, size: ART_SIZE };
};

// ---- 40-render.js ----
"use strict";
// The first-person view, in WebGL 2: the floor's walls, floor and ceiling as one mesh built when the floor is
// entered; chests, hatches and monsters as billboards rebuilt each frame; a torch that falls off with distance and
// flickers, and fog the colour of the depth. The camera steps and turns smoothly (or snaps, if that's the setting).
const VERT = `#version 300 es
precision highp float;
in vec3 aPos; in vec3 aUV; in float aShade; in vec2 aFx;
uniform mat4 uViewProj;
out vec3 vWorld; out vec3 vUV; out float vShade; out vec2 vFx;
void main() { vWorld = aPos; vUV = aUV; vShade = aShade; vFx = aFx; gl_Position = uViewProj * vec4(aPos, 1.0); }`;

const FRAG = `#version 300 es
precision highp float; precision highp sampler2DArray;
in vec3 vWorld; in vec3 vUV; in float vShade; in vec2 vFx;
uniform sampler2DArray uTex; uniform vec3 uEye; uniform vec3 uTorch; uniform vec3 uFog;
uniform float uReach; uniform float uFlicker; uniform float uAmbient;
out vec4 fragColor;
void main() {
  vec4 t = texture(uTex, vUV);
  if (t.a < 0.5) discard;
  float d = distance(vWorld, uEye);
  float r2 = uReach * uReach;
  float light = uAmbient + uFlicker * r2 / (r2 + 2.2 * d * d + 0.4 * d);
  vec3 col = t.rgb * vShade * uTorch * light;
  float fog = smoothstep(uReach * 0.55, uReach * 1.7, d);
  col = mix(col, uFog, fog);
  col = mix(col, vec3(1.0, 0.3, 0.2), vFx.x);
  fragColor = vec4(col, t.a * vFx.y);
}`;

const STRIDE = 9;                      // floats a vertex: pos 3, uv 3, shade 1, fx 2
const EYE_HEIGHT = 0.5;

function mat4Perspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}

function mat4LookAt(eye, target, up) {
  let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
  let len = Math.hypot(zx, zy, zz) || 1; zx /= len; zy /= len; zz /= len;
  let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
  len = Math.hypot(xx, xy, xz) || 1; xx /= len; xy /= len; xz /= len;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * eye[0] + xy * eye[1] + xz * eye[2]), -(yx * eye[0] + yy * eye[1] + yz * eye[2]), -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1]);
}

function mat4Mul(a, b) {
  const out = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k];
    out[i * 4 + j] = s;
  }
  return out;
}

CM.Renderer = class {
  constructor(canvas) {
    this.canvas = canvas;
    this.ok = false;
    this.error = "";
    const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, depth: true, preserveDrawingBuffer: true });
    if (!gl) { this.error = "This needs WebGL 2, and the browser hasn't got it."; return; }
    this.gl = gl;
    this.program = this._program(VERT, FRAG);
    if (!this.program) return;
    this.loc = {};
    for (const n of ["uViewProj", "uTex", "uEye", "uTorch", "uFog", "uReach", "uFlicker", "uAmbient"]) this.loc[n] = gl.getUniformLocation(this.program, n);
    this.staticBuf = gl.createBuffer(); this.staticCount = 0;
    this.dynBuf = gl.createBuffer(); this.dynCount = 0;
    this.texture = null; this.index = {};
    this.theme = CM.THEMES[0];
    this.eye = [1.5, EYE_HEIGHT, 1.5];
    this.yaw = 0;                      // radians; 0 looks north (-z), pi/2 east
    this.move = null;                  // {from, to, t, ms}
    this.turn = null;                  // {from, to, t, ms}
    this.sprites = [];
    this.time = 0;
    this.flicker = 1;
    this.viewProj = null;
    this.snap = false;
    this.bob = 0;
    this.ok = true;
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    this.resize();
  }

  _program(vs, fs) {
    const gl = this.gl;
    const make = (kind, src) => {
      const s = gl.createShader(kind);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { this.error = "A shader didn't compile: " + gl.getShaderInfoLog(s); return null; }
      return s;
    };
    const v = make(gl.VERTEX_SHADER, vs), f = make(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    const p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f);
    gl.bindAttribLocation(p, 0, "aPos"); gl.bindAttribLocation(p, 1, "aUV"); gl.bindAttribLocation(p, 2, "aShade"); gl.bindAttribLocation(p, 3, "aFx");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { this.error = "The shaders didn't link: " + gl.getProgramInfoLog(p); return null; }
    return p;
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(this.canvas.clientWidth * dpr)), h = Math.max(1, Math.round(this.canvas.clientHeight * dpr));
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
    this.gl.viewport(0, 0, w, h);
  }

  // ---- the textures ----
  setTextures(art) {
    const gl = this.gl;
    if (this.texture) gl.deleteTexture(this.texture);
    this.texture = gl.createTexture();
    this.index = art.index;
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.texture);
    gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, art.size, art.size, art.layers.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    art.layers.forEach((layer, i) => gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, art.size, art.size, 1, gl.RGBA, gl.UNSIGNED_BYTE, layer));
    gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const aniso = gl.getExtension("EXT_texture_filter_anisotropic");
    if (aniso) gl.texParameterf(gl.TEXTURE_2D_ARRAY, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  }

  // ---- the floor's mesh ----
  setFloor(floor, theme) {
    this.theme = theme;
    const grid = floor.grid, size = grid.length, out = [];
    const quad = (a, b, c, d, layer, shade) => {           // four corners, counter-clockwise from the bottom left as seen
      const uv = [[0, 1], [1, 1], [1, 0], [0, 0]];
      for (const i of [0, 1, 2, 0, 2, 3]) out.push(...[a, b, c, d][i], uv[i][0], uv[i][1], layer, shade, 0, 1);
    };
    const pickWall = (x, y, d) => {
      const h = (x * 73856093) ^ (y * 19349663) ^ (d * 83492791);
      const r = ((h >>> 0) % 1000) / 1000;
      return r < this.theme.bones * 0.5 ? this.index.wallbones : r < 0.6 ? this.index.wall : this.index.wall2;
    };
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (grid[y][x] !== 0) continue;
      quad([x, 0, y + 1], [x + 1, 0, y + 1], [x + 1, 0, y], [x, 0, y], this.index.floor, 0.9);
      quad([x, 1, y], [x + 1, 1, y], [x + 1, 1, y + 1], [x, 1, y + 1], this.index.ceiling, 0.7);
      const solid = (nx, ny) => ny < 0 || ny >= size || nx < 0 || nx >= size || grid[ny][nx] !== 0;
      if (solid(x, y - 1)) quad([x, 0, y], [x + 1, 0, y], [x + 1, 1, y], [x, 1, y], pickWall(x, y, 0), 1.0);                 // north wall, facing south
      if (solid(x, y + 1)) quad([x + 1, 0, y + 1], [x, 0, y + 1], [x, 1, y + 1], [x + 1, 1, y + 1], pickWall(x, y, 2), 1.0);   // south wall, facing north
      if (solid(x + 1, y)) quad([x + 1, 0, y], [x + 1, 0, y + 1], [x + 1, 1, y + 1], [x + 1, 1, y], pickWall(x, y, 1), 0.84);   // east wall, facing west
      if (solid(x - 1, y)) quad([x, 0, y + 1], [x, 0, y], [x, 1, y], [x, 1, y + 1], pickWall(x, y, 3), 0.84);                 // west wall, facing east
    }
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.staticBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(out), gl.STATIC_DRAW);
    this.staticCount = out.length / STRIDE;
  }

  // ---- the camera ----
  yawFor(facing) { return facing * Math.PI / 2; }

  setCamera(x, y, facing) {
    this.eye = [x + 0.5, EYE_HEIGHT, y + 0.5];
    this.yaw = this.yawFor(facing);
    this.move = this.turn = null;
  }

  moveTo(x, y, ms = 180) {
    const to = [x + 0.5, EYE_HEIGHT, y + 0.5];
    if (this.snap || ms <= 0) { this.eye = to; this.move = null; return; }
    this.move = { from: this.eye.slice(), to, t: 0, ms };
  }

  turnTo(facing, ms = 160) {
    let to = this.yawFor(facing), from = this.yaw;
    while (to - from > Math.PI) to -= Math.PI * 2;
    while (to - from < -Math.PI) to += Math.PI * 2;
    if (this.snap || ms <= 0) { this.yaw = to; this.turn = null; return; }
    this.turn = { from, to, t: 0, ms };
  }

  get busy() { return this.move !== null || this.turn !== null; }

  // where the camera is in grid terms (the cell it's heading for, while it steps)
  setSprites(list) { this.sprites = list; }

  // a world point on the canvas, in CSS pixels - or null when it's behind the camera
  project(x, y, z) {
    const m = this.viewProj;
    if (!m) return null;
    const cx = m[0] * x + m[4] * y + m[8] * z + m[12], cy = m[1] * x + m[5] * y + m[9] * z + m[13];
    const cw = m[3] * x + m[7] * y + m[11] * z + m[15];
    if (cw <= 0.01) return null;
    return [(cx / cw * 0.5 + 0.5) * this.canvas.clientWidth, (0.5 - cy / cw * 0.5) * this.canvas.clientHeight, cw];
  }

  _advance(dt) {
    if (this.move) {
      this.move.t = Math.min(1, this.move.t + dt * 1000 / this.move.ms);
      const k = CM.ease(this.move.t);
      this.eye = [CM.lerp(this.move.from[0], this.move.to[0], k), EYE_HEIGHT, CM.lerp(this.move.from[2], this.move.to[2], k)];
      this.bob = Math.sin(this.move.t * Math.PI) * 0.018;
      if (this.move.t >= 1) { this.move = null; this.bob = 0; }
    }
    if (this.turn) {
      this.turn.t = Math.min(1, this.turn.t + dt * 1000 / this.turn.ms);
      this.yaw = CM.lerp(this.turn.from, this.turn.to, CM.ease(this.turn.t));
      if (this.turn.t >= 1) { this.yaw = this.turn.to; this.turn = null; }
    }
  }

  _spriteMesh() {
    const out = [], right = [Math.cos(this.yaw), 0, Math.sin(this.yaw)];
    for (const s of this.sprites) {
      const layer = this.index[s.layer];
      if (layer === undefined) continue;
      const cx = s.x + 0.5 + (s.dx || 0), cz = s.y + 0.5 + (s.dz || 0), w = s.w || 0.7, h = s.h || 0.7;
      const flash = s.flash || 0, alpha = s.alpha === undefined ? 1 : s.alpha, shade = s.shade || 1;
      const uv = [[0, 1], [1, 1], [1, 0], [0, 0]];
      let corners;
      if (s.flat) {
        corners = [[cx - w / 2, 0.003, cz + w / 2], [cx + w / 2, 0.003, cz + w / 2], [cx + w / 2, 0.003, cz - w / 2], [cx - w / 2, 0.003, cz - w / 2]];
      } else {
        const lift = s.lift || 0;
        corners = [[cx - right[0] * w / 2, lift, cz - right[2] * w / 2], [cx + right[0] * w / 2, lift, cz + right[2] * w / 2],
          [cx + right[0] * w / 2, lift + h, cz + right[2] * w / 2], [cx - right[0] * w / 2, lift + h, cz - right[2] * w / 2]];
      }
      for (const i of [0, 1, 2, 0, 2, 3]) out.push(...corners[i], uv[i][0], uv[i][1], layer, shade, flash, alpha);
    }
    return out;
  }

  _attributes() {
    const gl = this.gl, bytes = STRIDE * 4;
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, bytes, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, bytes, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, bytes, 24);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 2, gl.FLOAT, false, bytes, 28);
  }

  frame(dt) {
    if (!this.ok || !this.texture) return;
    this.time += dt;
    this._advance(dt);
    // a torch flame: a slow wander and a quick shiver
    this.flicker = 0.92 + 0.06 * Math.sin(this.time * 7.3) + 0.03 * Math.sin(this.time * 17.1 + 1.0) + 0.02 * Math.sin(this.time * 31.7);
    const gl = this.gl, aspect = this.canvas.width / this.canvas.height;
    const eye = [this.eye[0], this.eye[1] + this.bob, this.eye[2]];
    const fwd = [Math.sin(this.yaw), 0, -Math.cos(this.yaw)];
    const view = mat4LookAt(eye, [eye[0] + fwd[0], eye[1], eye[2] + fwd[2]], [0, 1, 0]);
    const proj = mat4Perspective(Math.PI / 3, aspect, 0.05, 80);
    this.viewProj = mat4Mul(proj, view);
    const t = this.theme;
    gl.clearColor(t.fog[0], t.fog[1], t.fog[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.program);
    gl.uniformMatrix4fv(this.loc.uViewProj, false, this.viewProj);
    gl.uniform3fv(this.loc.uEye, eye);
    gl.uniform3fv(this.loc.uTorch, t.torch);
    gl.uniform3fv(this.loc.uFog, t.fog);
    gl.uniform1f(this.loc.uReach, t.reach);
    gl.uniform1f(this.loc.uFlicker, this.flicker);
    gl.uniform1f(this.loc.uAmbient, 0.06);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.texture);
    gl.uniform1i(this.loc.uTex, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.staticBuf);
    this._attributes();
    gl.drawArrays(gl.TRIANGLES, 0, this.staticCount);
    const dyn = this._spriteMesh();
    if (dyn.length) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(dyn), gl.DYNAMIC_DRAW);
      this._attributes();
      gl.drawArrays(gl.TRIANGLES, 0, dyn.length / STRIDE);
    }
  }

  // the colour of one pixel, for the tests: is anything being drawn?
  pixel(x, y) {
    const gl = this.gl, px = new Uint8Array(4);
    gl.readPixels(x, this.canvas.height - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return Array.from(px);
  }
};

// ---- 50-audio.js ----
"use strict";
// The sounds, made in code with Web Audio - the same recipes the old game cooked into .wav files: square and sine
// tones that fade, smoothed noise, and an eight-second dungeon (a low drone, a far rumble, water dripping) that loops.
// Browsers won't play a sound before the first click or key, so unlock() is called on the first of either.
CM.audio = {
  ctx: null,
  buffers: {},
  enabled: true,
  volume: 0.6,
  ambientOn: false,
  ambientNode: null,
  ambientGain: null,

  unlock() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.volume;
      this.master.connect(this.ctx.destination);
      this._cook();
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    if (this.ambientOn && !this.ambientNode) this._startAmbient();
    return true;
  },

  setEnabled(on) {
    this.enabled = on;
    if (this.master) this.master.gain.value = on ? this.volume : 0;
  },

  setVolume(v) {
    this.volume = CM.clamp(v, 0, 1);
    if (this.master && this.enabled) this.master.gain.value = this.volume;
  },

  _tones(notes, kind = "square", vol = 0.15) {
    const rate = this.ctx.sampleRate, out = [];
    for (const [freq, length] of notes) {
      const n = Math.floor(rate * length);
      for (let i = 0; i < n; i++) {
        const t = i / rate, fade = Math.pow(1 - i / n, 1.5);
        const v = kind === "sine" ? Math.sin(2 * Math.PI * freq * t) : ((t * freq) % 1 < 0.5 ? 1 : -1);
        out.push(v * vol * fade);
      }
    }
    return out;
  },

  _noise(length, vol, smooth, seed = 1) {
    const rate = this.ctx.sampleRate, rnd = new CM.Random(seed), out = [], n = Math.floor(rate * length);
    let last = 0;
    for (let i = 0; i < n; i++) {
      last += (rnd.next() * 2 - 1 - last) * smooth;
      out.push(last * vol * (1 - i / n));
    }
    return out;
  },

  _buffer(samples) {
    const b = this.ctx.createBuffer(1, samples.length, this.ctx.sampleRate);
    b.getChannelData(0).set(samples);
    return b;
  },

  _cook() {
    const T = (notes, kind, vol) => this._tones(notes, kind, vol);
    const recipes = {
      step: () => this._noise(0.09, 0.28, 0.08, 3),
      bump: () => T([[70, 0.12]], "square", 0.2),
      chest: () => T([[392, 0.07], [523, 0.07], [659, 0.12]]),
      hit: () => this._noise(0.12, 0.42, 0.5, 5),
      hurt: () => T([[180, 0.06], [120, 0.1]], "square", 0.18),
      spell: () => T(Array.from({ length: 15 }, (_, i) => [400 + i * 80, 0.025]), "sine", 0.2),
      heal: () => T([[523, 0.07], [659, 0.07], [784, 0.07], [1047, 0.14]], "sine", 0.18),
      coin: () => T([[1319, 0.05], [1760, 0.12]]),
      stairs: () => T([[392, 0.1], [330, 0.1], [262, 0.1], [196, 0.2]], "sine", 0.18),
      level: () => T([[523, 0.09], [659, 0.09], [784, 0.09], [1047, 0.09], [784, 0.09], [1047, 0.25]]),
      death: () => T([[330, 0.2], [262, 0.2], [196, 0.25], [131, 0.5]], "sine", 0.2),
      victory: () => T([[523, 0.12], [523, 0.12], [523, 0.12], [659, 0.3], [587, 0.15], [784, 0.5]]),
      monster: () => T([[110, 0.15], [98, 0.25]], "square", 0.18),
    };
    for (const [name, make] of Object.entries(recipes)) this.buffers[name] = this._buffer(make());
    // the dungeon itself
    const rate = this.ctx.sampleRate, secs = 8, n = rate * secs, rnd = new CM.Random(11);
    const rumble = this._noise(secs, 0.08, 0.01, 7);
    const drips = Array.from({ length: 5 }, () => 0.3 + rnd.next() * (secs - 0.7)).sort();
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const t = i / rate;
      let v = 0.028 * Math.sin(2 * Math.PI * 55 * t) * (0.7 + 0.3 * Math.sin(2 * Math.PI * 0.25 * t));
      v += 0.015 * Math.sin(2 * Math.PI * 82.5 * t);
      v += rumble[i];
      for (const d of drips) {
        const k = t - d;
        if (k >= 0 && k < 0.25) v += 0.15 * Math.sin(2 * Math.PI * (1800 - k * 2000) * k) * Math.exp(-k * 25);
      }
      out[i] = v;
    }
    const b = this.ctx.createBuffer(1, n, rate);
    b.getChannelData(0).set(out);
    this.buffers.ambient = b;
  },

  play(name) {
    if (!this.ctx || !this.enabled || !this.buffers[name]) return;
    const src = this.ctx.createBufferSource();
    src.buffer = this.buffers[name];
    src.connect(this.master);
    src.start();
  },

  _startAmbient() {
    if (!this.ctx || !this.buffers.ambient) return;
    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.value = 0.5;
    this.ambientGain.connect(this.master);
    this.ambientNode = this.ctx.createBufferSource();
    this.ambientNode.buffer = this.buffers.ambient;
    this.ambientNode.loop = true;
    this.ambientNode.connect(this.ambientGain);
    this.ambientNode.start();
  },

  ambience(on) {
    this.ambientOn = on;
    if (on) { if (this.ctx && !this.ambientNode) this._startAmbient(); }
    else if (this.ambientNode) { try { this.ambientNode.stop(); } catch (e) { /* already stopped */ } this.ambientNode = null; }
  },
};

// ---- 60-game.js ----
"use strict";
// The game itself, with no screen in it: the party, the floor they're on, the fight they're in, the camp, the bag,
// saving as it goes, the Hall of Fame. The window (70-ui.js) listens to its events and draws; the tests drive it
// straight. Everything here was the old Python game's rules, kept to the number.
CM.Game = class {
  constructor() {
    this.listeners = {};
    this.mode = "title";                 // title, explore, combat, camp
    this.titleNote = "";
    this.messages = [];
    this.party = []; this.bag = []; this.gold = 0; this.floor = null; this.foes = []; this.foeKey = null;
    this.seed = "";
    this.stock = null; this.shopping = false;
    this.rnd = new CM.Random(Math.floor(Math.random() * 4294967296));
    this.fame = CM.store.get("fame", []);
    this.settings = Object.assign({ sound: true, volume: 0.6, smooth: true, fps: false }, CM.store.get("settings", {}));
    this.lastRun = CM.store.get("run", null);        // a run left part way, to continue
  }

  // ---- events: change (redraw), message, mode, floor, moved, turned, fx, sound ----
  on(event, fn) { (this.listeners[event] = this.listeners[event] || []).push(fn); return this; }
  emit(event, ...args) { for (const fn of this.listeners[event] || []) fn(...args); }

  say(text) {
    this.messages.push(text);
    if (this.messages.length > 60) this.messages = this.messages.slice(-60);
    this.emit("message", text);
    this.emit("change");
  }

  sound(name) { this.emit("sound", name); }

  setMode(mode) { this.mode = mode; this.emit("mode", mode); this.emit("change"); }

  saveSettings() { CM.store.set("settings", this.settings); }

  // ---- saving ----
  saveRun() {
    if (!["explore", "camp"].includes(this.mode)) return;
    const data = { party: this.party, bag: this.bag, gold: this.gold, floor: this.floor, mode: this.mode, seed: this.seed,
      saved: new Date().toISOString() };
    this.lastRun = data;
    CM.store.set("run", data);
  }

  canContinue() { return Boolean(this.lastRun && this.lastRun.floor && this.lastRun.party); }

  continueRun() {
    const d = this.lastRun;
    if (!this.canContinue()) return false;
    this.party = d.party; this.bag = d.bag || []; this.gold = d.gold || 0; this.floor = d.floor;
    this.seed = d.seed || CM.randomSeed();
    this.messages = [];
    this.setMode(d.mode === "camp" ? "camp" : "explore");
    this.emit("floor", this.floor);
    this.say("You take up the expedition where you left it.");
    return true;
  }

  endRun(won) {
    const entry = { name: CM.playerName || "Adventurer", floor: this.floor.number, gold: this.gold, won, date: CM.today(), seed: this.seed };
    this.fame.push(entry);
    this.sortFame();
    CM.store.set("fame", this.fame);
    CM.store.remove("run");
    this.lastRun = null;
    this.sound(won ? "victory" : "death");
    this.titleNote = won ? "The Lich King is no more. The party returns as legends!"
      : `The party fell on floor ${this.floor.number}. Their story ends here.`;
    this.emit("over", won);
    this.setMode("title");
  }

  sortFame() {
    this.fame.sort((a, b) => (b.won ? 1 : 0) - (a.won ? 1 : 0) || b.floor - a.floor || b.gold - a.gold);
    this.fame = this.fame.slice(0, 10);
  }

  // what the old Python game kept on disk (run.json, hall_of_fame.json), brought over once by the Timeline's host
  importOld(data) {
    let took = [];
    if (data && Array.isArray(data.fame) && data.fame.length) {
      const have = new Set(this.fame.map((e) => `${e.name}|${e.floor}|${e.gold}|${e.date}`));
      for (const e of data.fame) if (e && !have.has(`${e.name}|${e.floor}|${e.gold}|${e.date}`)) this.fame.push(e);
      this.sortFame();
      CM.store.set("fame", this.fame);
      took.push("fame");
    }
    if (data && data.run && data.run.floor && data.run.party && !this.canContinue()) {
      this.lastRun = Object.assign({ seed: CM.randomSeed(), mode: "explore" }, data.run);
      CM.store.set("run", this.lastRun);
      took.push("run");
    }
    this.emit("change");
    return took;
  }

  exportText() {
    return JSON.stringify({ game: "Claude and Magic", version: CM.version, run: this.lastRun, fame: this.fame, settings: this.settings });
  }

  importText(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return "That isn't a Claude and Magic save."; }
    if (!data || data.game !== "Claude and Magic") return "That isn't a Claude and Magic save.";
    if (data.run && data.run.floor && data.run.party) { this.lastRun = data.run; CM.store.set("run", data.run); }
    if (Array.isArray(data.fame)) { this.fame = data.fame; this.sortFame(); CM.store.set("fame", this.fame); }
    if (data.settings) { Object.assign(this.settings, data.settings); this.saveSettings(); }
    this.emit("change");
    return "";
  }

  // ---- starting ----
  newGame(seed) {
    this.seed = (seed || "").trim() || CM.randomSeed();
    this.party = CM.newParty();
    this.bag = CM.startingBag(this.seed);
    this.gold = 30;
    this.messages = [];
    this.titleNote = "";
    this.enterFloor(1);
    this.say("Four adventurers climb down into the dark. Somewhere below, the Lich King stirs.");
  }

  enterFloor(number) {
    this.floor = CM.makeFloor(number, this.seed);
    this.setMode("explore");
    this.look();
    this.emit("floor", this.floor);
    this.saveRun();
    this.say(`Floor ${number}.` + (number === CM.LAST_FLOOR ? "  A terrible cold rises from somewhere ahead..." : ""));
  }

  // ---- moving ----
  turn(way) {
    if (this.mode !== "explore") return false;
    this.floor.facing = (this.floor.facing + way + 4) % 4;
    this.look();
    this.emit("turned", this.floor.facing);
    this.emit("change");
    return true;
  }

  move(rel) {
    if (this.mode !== "explore") return false;
    const fl = this.floor;
    const [dx, dy] = CM.DIRS[(fl.facing + rel) % 4];
    const x = fl.pos[0] + dx, y = fl.pos[1] + dy;
    if (y < 0 || y >= fl.grid.length || x < 0 || x >= fl.grid.length || fl.grid[y][x]) {
      this.sound("bump");
      this.say("Ouch! A solid wall.");
      return false;
    }
    const thing = fl.things[`${x},${y}`];
    if (thing && (thing.type === "monsters" || thing.type === "boss")) {
      this.startCombat(`${x},${y}`, thing);
      return false;
    }
    fl.pos = [x, y];
    this.sound("step");
    this.look();
    this.emit("moved", x, y);
    if (thing) this.say({ chest: "A chest sits here. (Space to open it)", ladder: "A ladder leads down into the dark. (Space to climb down)" }[thing.type]);
    this.emit("change");
    return true;
  }

  // what the party can see goes on the automap: around them, and along the corridor they face
  look() {
    const fl = this.floor, size = fl.grid.length;
    const seen = new Set(fl.seen.map(([x, y]) => `${x},${y}`));
    const [x, y] = fl.pos;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) seen.add(`${x + dx},${y + dy}`);
    const [fx, fy] = CM.DIRS[fl.facing];
    for (let d = 1; d < 5; d++) {
      const cx = x + fx * d, cy = y + fy * d;
      seen.add(`${cx},${cy}`); seen.add(`${cx + fy},${cy + fx}`); seen.add(`${cx - fy},${cy - fx}`);
      if (cy < 0 || cy >= size || cx < 0 || cx >= size || fl.grid[cy][cx]) break;
    }
    fl.seen = [...seen].map((k) => k.split(",").map(Number)).filter(([a, b]) => a >= 0 && a < size && b >= 0 && b < size);
  }

  use() {
    if (this.mode !== "explore") return;
    const fl = this.floor, key = `${fl.pos[0]},${fl.pos[1]}`, thing = fl.things[key];
    if (!thing) { this.say("There's nothing here to use."); return; }
    if (thing.type === "chest") {
      delete fl.things[key];
      this.gold += thing.gold;
      this.bag.push(...thing.items);
      this.sound("chest");
      const found = thing.items.map((i) => i.name).join(", ");
      this.say(`The chest creaks open: ${thing.gold} gold` + (found ? `, ${found}.` : "."));
      this.saveRun();
      this.emit("change");
    } else if (thing.type === "ladder") {
      this.sound("stairs");
      if (CM.CAMP_AFTER.includes(fl.number)) {
        this.setMode("camp");
        this.saveRun();
        this.say(`Halfway down a long shaft, a lantern glows: a merchant's camp beneath floor ${fl.number}. Rest, trade, and see to the fallen.`);
      } else {
        this.enterFloor(fl.number + 1);
      }
    }
  }

  // ---- fighting ----
  startCombat(key, thing) {
    this.foes = thing.group;
    this.foeKey = key;
    this.setMode("combat");
    this.sound("monster");
    const names = {};
    for (const m of this.foes) names[m.name] = (names[m.name] || 0) + 1;
    this.say("Monsters! " + Object.entries(names).map(([k, n]) => CM.plural(n, k)).join(", ") + " attack!");
  }

  alive() { return this.party.filter((m) => m.hp > 0); }
  living() { return this.foes.filter((m) => m.hp > 0); }

  damage(atk, power, df) {
    return Math.max(1, atk + power + this.rnd.int(0, Math.max(1, Math.floor((atk + power) / 2))) - Math.floor(df / 2));
  }

  combatRound(action) {
    if (this.mode !== "combat") return;
    const rnd = this.rnd;
    let foes = this.living();
    if (action === "run") {
      if (rnd.chance(foes.some((m) => m.boss) ? 0 : 0.55)) {
        this.say("The party flees back the way it came!");
        this.setMode("explore");
        return;
      }
      this.say("You can't get away!");
    } else if (action === "potion") {
      this.potionInBattle();
    }
    for (const hero of this.alive()) {
      foes = this.living();
      if (!foes.length || action === "run" || action === "potion") break;
      if (action === "cast" && hero.cls === "Mage" && hero.mp >= 4) {
        hero.mp -= 4;
        this.sound("spell");
        const dmg = 8 + hero.level * 4;
        for (const m of foes) { m.hp -= dmg; this.emit("fx", { kind: "hit", foe: m, amount: dmg, spell: true }); }
        this.say(`The Mage hurls a fireball! ${dmg} damage to every foe.`);
      } else if (action === "cast" && hero.cls === "Cleric" && hero.mp >= 3) {
        hero.mp -= 3;
        const target = this.alive().reduce((a, b) => (a.hp / a.max <= b.hp / b.max ? a : b));
        const heal = 12 + hero.level * 4;
        target.hp = Math.min(target.max, target.hp + heal);
        this.sound("heal");
        this.say(`The Cleric prays: the ${target.cls} is healed by ${heal}.`);
      } else {
        const target = rnd.pick(foes);
        if (rnd.chance(0.88)) {
          let dmg = this.damage(hero.atk, hero.weapon.power, target.df);
          if (hero.cls === "Rogue" && rnd.chance(0.25)) {
            dmg *= 2;
            this.say(`The Rogue strikes a weak spot! ${target.name} takes ${dmg}.`);
          } else {
            this.say(`The ${hero.cls} hits the ${target.name} for ${dmg}.`);
          }
          target.hp -= dmg;
          this.emit("fx", { kind: "hit", foe: target, amount: dmg });
          this.sound("hit");
        } else {
          this.say(`The ${hero.cls} misses.`);
          this.emit("fx", { kind: "miss", foe: target });
        }
      }
    }
    for (const m of this.foes) if (m.hp <= 0 && !m.dead) { m.dead = true; this.emit("fx", { kind: "die", foe: m }); }
    if (!this.living().length) { this.wonFight(); return; }
    for (const m of this.living()) {                                     // the monsters' turn
      const heroes = this.alive();
      if (!heroes.length) break;
      const target = rnd.pick(heroes);
      if (rnd.chance(0.8)) {
        const dmg = this.damage(Math.floor(m.atk / 2), 0, target.df + target.armor.power * 2);
        target.hp -= dmg;
        this.sound("hurt");
        this.emit("fx", { kind: "hurt", hero: target, amount: dmg, foe: m });
        this.say(`The ${m.name} hits the ${target.cls} for ${dmg}.` + (target.hp <= 0 ? `  The ${target.cls} falls!` : ""));
      } else {
        this.say(`The ${m.name} misses the ${target.cls}.`);
      }
    }
    for (const hero of this.party) hero.hp = Math.max(0, hero.hp);
    if (!this.alive().length) {
      this.say("The last of the party falls...");
      this.endRun(false);
      return;
    }
    this.emit("change");
  }

  potionInBattle() {
    const potion = this.bag.find((i) => i.kind === "heal");
    if (!potion) { this.say("No healing potions left!"); return; }
    const target = this.alive().reduce((a, b) => (a.hp / a.max <= b.hp / b.max ? a : b));
    this.bag.splice(this.bag.indexOf(potion), 1);
    target.hp = Math.min(target.max, target.hp + potion.power);
    this.sound("heal");
    this.say(`The ${target.cls} drinks a Healing Potion (+${potion.power}).`);
  }

  wonFight() {
    const rnd = this.rnd;
    const xp = this.foes.reduce((s, m) => s + m.xp, 0), gold = this.foes.reduce((s, m) => s + m.gold, 0);
    this.gold += gold;
    const loot = rnd.chance(0.45) ? [CM.makeItem(this.floor.number, rnd)] : [];
    this.bag.push(...loot);
    const boss = this.foes.some((m) => m.boss);
    delete this.floor.things[this.foeKey];
    this.sound("coin");
    this.say(`Victory! ${xp} experience and ${gold} gold` + (loot.length ? `, and a ${loot[0].name}.` : "."));
    for (const hero of this.alive()) {
      hero.xp += Math.floor(xp / 2);                                      // everyone standing learns from the fight
      while (hero.xp >= 60 * Math.pow(hero.level, 1.6)) {
        hero.level += 1;
        const base = CM.CLASSES[hero.cls];
        hero.max += Math.max(3, Math.floor(base.hp / 5));
        hero.hp = hero.max;
        hero.atk += 1 + (hero.cls === "Knight" || hero.cls === "Rogue" ? 1 : 0);
        hero.df += hero.level % 2 === 0 ? 1 : 0;
        if (hero.maxmp) { hero.maxmp += 3; hero.mp = hero.maxmp; }
        this.sound("level");
        this.say(`The ${hero.cls} reaches level ${hero.level}!`);
      }
    }
    if (boss) { this.endRun(true); return; }
    this.setMode("explore");
    this.saveRun();
  }

  // ---- the bag, the merchant, the camp ----
  openBag(shop = false) {
    this.shopping = shop;
    if (shop && !this.stock) {
      const rnd = this.rnd, depth = this.floor.number + 3;
      this.stock = ["weapon", "weapon", "weapon", "armor", "armor", "armor"].map((k) => CM.makeItem(depth, rnd, k));
      this.stock.push({ name: "Healing Potion", kind: "heal", power: 20 + depth * 3, value: 20 },
        { name: "Mana Potion", kind: "mana", power: 12 + depth, value: 25 },
        { name: "Phoenix Feather", kind: "revive", power: 0, value: 120 });
    }
    this.emit("bag", true);
  }

  closeBag() {
    this.emit("bag", false);
    this.saveRun();
    this.emit("change");
  }

  describe(item) {
    return { weapon: `weapon +${item.power}`, armor: `armor +${item.power}`, heal: "heals", mana: "restores magic", revive: "raises the fallen" }[item.kind];
  }

  give(row, n) {                                                        // returns a note for the bag screen, "" when it worked
    if (row < 0 || row >= this.bag.length) return "Pick something from your pack first.";
    const item = this.bag[row], hero = this.party[n];
    if (item.kind === "revive") {
      if (hero.hp > 0) return "The Phoenix Feather is for the fallen.";
      hero.hp = Math.floor(hero.max / 2);
      this.bag.splice(row, 1);
      this.sound("heal");
    } else if (hero.hp <= 0) {
      return `The ${hero.cls} has fallen. Raise them first.`;
    } else if (item.kind === "heal") {
      hero.hp = Math.min(hero.max, hero.hp + item.power);
      this.bag.splice(row, 1);
      this.sound("heal");
    } else if (item.kind === "mana") {
      if (!hero.maxmp) return `The ${hero.cls} has no magic to restore.`;
      hero.mp = Math.min(hero.maxmp, hero.mp + item.power);
      this.bag.splice(row, 1);
      this.sound("heal");
    } else {
      const old = hero[item.kind];
      hero[item.kind] = item;
      this.bag[row] = old;
      this.sound("chest");
    }
    this.emit("change");
    return "";
  }

  buy(row) {
    if (!this.stock || row < 0 || row >= this.stock.length) return "Pick something from the merchant's wares first.";
    const item = this.stock[row];
    if (this.gold < item.value) return "You can't afford that.";
    this.gold -= item.value;
    this.bag.push(Object.assign({}, item));
    if (item.kind === "weapon" || item.kind === "armor") this.stock.splice(row, 1);
    this.sound("coin");
    this.emit("change");
    return "";
  }

  sell(row) {
    if (row < 0 || row >= this.bag.length) return "Pick something from your pack to sell.";
    const item = this.bag.splice(row, 1)[0];
    this.gold += Math.floor(item.value / 2);
    this.sound("coin");
    this.emit("change");
    return "";
  }

  rest() {
    if (this.gold < 20) { this.say("The merchant wants 20 gold for a bedroll by the fire."); return; }
    this.gold -= 20;
    for (const m of this.alive()) { m.hp = m.max; m.mp = m.maxmp; }
    this.sound("heal");
    this.say("The party rests by the fire. Wounds close and magic returns.");
    this.saveRun();
  }

  raiseDead() {
    const fallen = this.party.filter((m) => m.hp <= 0);
    if (!fallen.length) { this.say("No one needs raising."); return; }
    const hero = fallen[0], cost = 100 * hero.level;
    if (this.gold < cost) { this.say(`The old priest asks ${cost} gold to raise the ${hero.cls}.`); return; }
    this.gold -= cost;
    hero.hp = hero.max;
    this.sound("heal");
    this.say(`For ${cost} gold, the priest raises the ${hero.cls}!`);
    this.saveRun();
  }

  leaveCamp() {
    this.stock = null;
    this.enterFloor(this.floor.number + 1);
  }

  potionCount() { return this.bag.filter((i) => ["heal", "mana", "revive"].includes(i.kind)).length; }
};

"use strict";
// The window around the dungeon: the title (what you set out with, the Hall of Fame, settings), the party and the
// log under the view, the automap, the bag and the merchant, and the little dialogs. It listens to the Game and
// redraws; it never decides the rules.
CM.UI = class {
  constructor(game, root) {
    this.game = game;
    this.root = root;
    this.bagRow = -1; this.shopRow = -1;
    this.portraits = {};
    root.innerHTML = `
<div id="title" class="screen">
  <div class="backdrop-slot"></div><div class="shade"></div>
  <div class="sheet">
    <h1>Claude and Magic</h1>
    <div class="tagline">Twenty floors down, the Lich King waits. Four go in together.</div>
    <div class="note" id="title-note"></div>
    <div class="card" id="expedition">
      <h2>Expedition</h2>
      <div class="row"><button id="btn-continue" class="primary">Continue</button><span id="continue-note" class="small"></span></div>
      <div class="row"><button id="btn-new" class="primary">New Expedition</button><label for="seed">Seed</label><input id="seed" type="text" maxlength="40" spellcheck="false"><button id="btn-dice" title="Another seed">&#x2684;</button></div>
      <p>The same seed lays out the same twenty floors, so a dungeon can be tried again - or handed to a friend. What
      the monsters do in a fight is up to the dice. The run saves as you go; when the whole party falls, it ends, and
      the deepest runs go in the Hall of Fame.</p>
      <h2>Your party</h2>
      <div id="heroes"></div>
      <p id="start-with"></p>
    </div>
    <div class="card" id="fame"><h2>Hall of Fame</h2><table></table></div>
    <div class="foot"><button id="btn-settings">Settings</button><button id="btn-keys">Keys</button><button id="btn-transfer">Export / Import</button></div>
    <div class="version"></div>
  </div>
</div>
<div id="play" class="screen">
  <div class="top">
    <div id="view"><div class="canvas-slot"></div><canvas id="hud"></canvas><div class="vignette"></div><div class="compass"></div><div class="fps"></div><div class="hurt"></div><div id="floats"></div><div class="hint"></div></div>
    <div id="side"><canvas id="automap" width="290" height="290"></canvas><div class="where"></div><div class="purse"></div></div>
  </div>
  <div id="party"></div>
  <div id="log"></div>
  <div id="actions"></div>
</div>
<div id="bag" class="screen">
  <h2 id="bag-title"></h2>
  <div class="lists"><div class="list" id="bag-list"></div><div class="list" id="shop-list"></div></div>
  <div class="note" id="bag-note"></div>
  <div class="give" id="bag-give"></div>
  <div class="act"><button id="btn-buy">Buy</button><button id="btn-sell">Sell</button><button id="btn-bag-done" class="primary">Done</button></div>
</div>
<div class="dialog" id="dlg-settings"><div class="box"><h2>Settings</h2>
  <div class="row"><label for="set-sound">Sound</label><input type="checkbox" id="set-sound"></div>
  <div class="row"><label for="set-volume">Volume</label><input type="range" id="set-volume" min="0" max="100"></div>
  <div class="row"><label for="set-smooth">Smooth steps and turns (off: snap, the classic way)</label><input type="checkbox" id="set-smooth"></div>
  <div class="row"><label for="set-fps">Show frames per second (F3)</label><input type="checkbox" id="set-fps"></div>
  <div class="end"><button class="close">Close</button></div></div></div>
<div class="dialog" id="dlg-keys"><div class="box"><h2>Keys</h2><table class="keys"></table><div class="end"><button class="close">Close</button></div></div></div>
<div class="dialog" id="dlg-transfer"><div class="box"><h2>Export / Import</h2>
  <p class="small">Your run, the Hall of Fame and your settings, as text. Copy it to keep it or to carry it to another
  browser; paste a copy here and Import to bring it back.</p>
  <textarea id="transfer-text" spellcheck="false"></textarea>
  <div class="small" id="transfer-note"></div>
  <div class="end"><button id="btn-copy">Copy</button><button id="btn-import">Import</button><button class="close">Close</button></div></div></div>
<div class="dialog" id="dlg-pause"><div class="box"><h2>Paused</h2>
  <p class="small">The run is saved as you go.</p>
  <div class="end"><button id="btn-pause-settings">Settings</button><button id="btn-pause-title">Back to the title</button><button class="close primary">Carry on</button></div></div></div>
<div class="dialog" id="bigmap"><canvas id="bigmap-canvas" width="600" height="600"></canvas></div>`;
    this.$ = (sel) => root.querySelector(sel);
    this.canvas = document.createElement("canvas");                        // the one WebGL canvas, moved between screens
    this.canvas.id = "gl";
    this.attachCanvas("title");
    for (const b of root.querySelectorAll(".dialog .close")) b.addEventListener("click", () => this.closeDialogs());
    for (const d of root.querySelectorAll(".dialog")) d.addEventListener("click", (e) => { if (e.target === d) this.closeDialogs(); });
    this._title();
    this._bag();
    this._settings();
    this.$("#btn-pause-settings").addEventListener("click", () => { this.closeDialogs(); this.openDialog("#dlg-settings"); });
    this.$("#btn-pause-title").addEventListener("click", () => { this.closeDialogs(); game.saveRun(); game.setMode("title"); });
    const keys = this.$("#dlg-keys table");
    keys.innerHTML = CM.KEYS_HELP.map(([k, what]) => `<tr><td><kbd>${k}</kbd></td><td>${what}</td></tr>`).join("");
    this.$("#title .version").textContent = `Claude and Magic v${CM.version}`;
    game.on("change", () => this.refresh());
    game.on("mode", (mode) => this.show(mode === "title" ? "title" : "play"));
    game.on("bag", (open) => (open ? this.openBag() : this.show("play")));
    game.on("fx", (fx) => this.fx(fx));
    this.show("title");
  }

  attachCanvas(where) {
    const slot = where === "title" ? this.$("#title .backdrop-slot") : this.$("#view .canvas-slot");
    if (this.canvas.parentNode !== slot) slot.appendChild(this.canvas);
    this.canvas.className = where === "title" ? "backdrop" : "";
  }

  show(screen) {
    for (const s of this.root.querySelectorAll(".screen")) s.classList.toggle("on", s.id === screen);
    this.screen = screen;
    if (screen === "title") { this.attachCanvas("title"); this.refreshTitle(); }
    if (screen === "play") this.attachCanvas("play");
    this.refresh();
  }

  dialogOpen() { return Boolean(this.root.querySelector(".dialog.on")); }
  openDialog(sel) { this.closeDialogs(); this.$(sel).classList.add("on"); }
  closeDialogs() { for (const d of this.root.querySelectorAll(".dialog.on")) d.classList.remove("on"); }

  portrait(cls, size) {
    const key = `${cls}:${size}`;
    if (!this.portraits[key]) this.portraits[key] = CM.art.portrait(cls, size);
    const c = document.createElement("canvas");
    c.width = c.height = size;
    c.getContext("2d").drawImage(this.portraits[key], 0, 0);
    return c;
  }

  // ---- the title ----
  _title() {
    const g = this.game;
    this.$("#seed").value = CM.randomSeed();
    this.$("#btn-dice").addEventListener("click", () => { this.$("#seed").value = CM.randomSeed(); });
    this.$("#btn-new").addEventListener("click", () => this.startNew());
    this.$("#btn-continue").addEventListener("click", () => g.continueRun());
    this.$("#btn-settings").addEventListener("click", () => this.openDialog("#dlg-settings"));
    this.$("#btn-keys").addEventListener("click", () => this.openDialog("#dlg-keys"));
    this.$("#btn-transfer").addEventListener("click", () => {
      this.$("#transfer-text").value = g.exportText();
      this.$("#transfer-note").textContent = "";
      this.openDialog("#dlg-transfer");
    });
    this.$("#btn-copy").addEventListener("click", () => {
      const t = this.$("#transfer-text");
      t.select();
      const done = navigator.clipboard ? navigator.clipboard.writeText(t.value).then(() => true, () => false) : Promise.resolve(document.execCommand("copy"));
      done.then((ok) => { this.$("#transfer-note").textContent = ok ? "Copied." : "Select the text and copy it yourself."; });
    });
    this.$("#btn-import").addEventListener("click", () => {
      const err = g.importText(this.$("#transfer-text").value);
      this.$("#transfer-note").textContent = err || "Imported.";
      this.refreshTitle();
    });
    const heroes = this.$("#heroes");
    for (const hero of CM.newParty()) {
      const div = document.createElement("div");
      div.className = "hero";
      div.appendChild(this.portrait(hero.cls, 48));
      const s = CM.CLASSES[hero.cls];
      const text = document.createElement("div");
      text.innerHTML = `<b>${hero.cls}</b> <small>${s.role} - ${s.hp} HP${s.mp ? `, ${s.mp} MP` : ""}, attack ${s.atk}, defence ${s.df}</small>
        <small>${s.blurb}</small><span class="gear">${hero.weapon.name}, ${hero.armor.name}</span>`;
      div.appendChild(text);
      heroes.appendChild(div);
    }
  }

  startNew() {
    const g = this.game;
    if (g.canContinue() && !window.confirm("A run is waiting to be continued. Start a new expedition and let it go?")) return;
    g.newGame(this.$("#seed").value);
  }

  refreshTitle() {
    const g = this.game;
    this.$("#title-note").textContent = g.titleNote;
    const can = g.canContinue();
    this.$("#btn-continue").disabled = !can;
    this.$("#continue-note").textContent = can
      ? `Floor ${g.lastRun.floor.number}, ${g.lastRun.gold.toLocaleString()} gold${g.lastRun.saved ? ", saved " + new Date(g.lastRun.saved).toLocaleString() : ""}`
      : "No expedition is under way.";
    const bag = CM.startingBag(this.$("#seed").value || "x");
    this.$("#start-with").textContent = `You set out with 30 gold and two potions (${bag.map((i) => i.name).join(", ")} - the seed decides which). `
      + "Chests and fallen monsters give better gear; a merchant's camp waits below floors 5, 10 and 15.";
    const table = this.$("#fame table");
    if (!g.fame.length) table.innerHTML = `<tr><td class="empty">No party has gone down yet.</td></tr>`;
    else table.innerHTML = g.fame.map((e, i) => `<tr><td>${i + 1}.</td><td>${this.esc(e.name).slice(0, 14)}</td>`
      + `<td class="${e.won ? "won" : ""}">${e.won ? "SLEW THE LICH KING" : "floor " + e.floor}</td><td>${e.gold.toLocaleString()} gold</td><td>${this.esc(e.date)}</td></tr>`).join("");
  }

  esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---- settings ----
  _settings() {
    const g = this.game, s = g.settings;
    const sound = this.$("#set-sound"), vol = this.$("#set-volume"), smooth = this.$("#set-smooth"), fps = this.$("#set-fps");
    sound.checked = s.sound; vol.value = Math.round(s.volume * 100); smooth.checked = s.smooth; fps.checked = s.fps;
    const apply = () => {
      s.sound = sound.checked; s.volume = vol.value / 100; s.smooth = smooth.checked; s.fps = fps.checked;
      g.saveSettings();
      g.emit("settings", s);
    };
    for (const el of [sound, vol, smooth, fps]) el.addEventListener("input", apply);
  }

  toggleFps() {
    this.game.settings.fps = !this.game.settings.fps;
    this.$("#set-fps").checked = this.game.settings.fps;
    this.game.saveSettings();
    this.game.emit("settings", this.game.settings);
  }

  // ---- the dungeon screen ----
  refresh() {
    const g = this.game;
    if (this.screen === "title") { this.refreshTitle(); return; }
    if (this.screen !== "play") return;
    const fl = g.floor;
    if (fl) {
      this.$("#view .compass").textContent = `${CM.DIR_NAMES[fl.facing]}   -   Floor ${fl.number}`;
      this.$("#side .where").textContent = `${CM.themeFor(fl.number).name} - floor ${fl.number}`;
    }
    this.$("#side .purse").textContent = `Gold: ${g.gold.toLocaleString()}   Potions: ${g.potionCount()}`;
    const hint = this.$("#view .hint");
    if (g.mode === "camp") hint.textContent = "A merchant's camp. Rest, trade, see to the fallen - then go deeper.";
    else if (g.mode === "combat") hint.textContent = "";
    else {
      const thing = fl && fl.things[`${fl.pos[0]},${fl.pos[1]}`];
      hint.textContent = thing ? (thing.type === "chest" ? "A chest. Space opens it." : "A ladder down. Space climbs it.") : "";
    }
    this.renderParty();
    this.renderLog();
    this.renderActions();
    this.drawAutomap(this.$("#automap"));
    if (this.$("#bigmap").classList.contains("on")) this.drawAutomap(this.$("#bigmap-canvas"));
  }

  renderParty() {
    const box = this.$("#party");
    if (box.children.length !== this.game.party.length) {
      box.innerHTML = "";
      for (const m of this.game.party) {
        const div = document.createElement("div");
        div.className = "member";
        div.appendChild(this.portrait(m.cls, 44));
        const text = document.createElement("div");
        text.innerHTML = `<div class="name"></div><div class="gear"></div><div class="bar hp"><i></i><span></span></div><div class="bar mp"><i></i><span></span></div>`;
        div.appendChild(text);
        box.appendChild(div);
      }
    }
    this.game.party.forEach((m, i) => {
      const div = box.children[i], dead = m.hp <= 0;
      div.classList.toggle("fallen", dead);
      div.querySelector(".name").textContent = `${m.cls}  Lv ${m.level}` + (dead ? "  (fallen)" : "");
      div.querySelector(".gear").textContent = `${m.weapon.name} / ${m.armor.name}`;
      const hp = div.querySelector(".bar.hp");
      hp.querySelector("i").style.width = `${100 * Math.max(0, m.hp) / Math.max(1, m.max)}%`;
      hp.querySelector("span").textContent = `HP ${Math.max(0, m.hp)}/${m.max}`;
      const mp = div.querySelector(".bar.mp");
      mp.style.display = m.maxmp ? "" : "none";
      mp.querySelector("i").style.width = `${100 * Math.max(0, m.mp) / Math.max(1, m.maxmp)}%`;
      mp.querySelector("span").textContent = `MP ${m.mp}/${m.maxmp}`;
    });
  }

  renderLog() {
    const log = this.$("#log");
    const lines = this.game.messages.slice(-7);
    log.innerHTML = lines.map((l) => `<div>${this.esc(l)}</div>`).join("");
  }

  renderActions() {
    const g = this.game, box = this.$("#actions");
    const sets = {
      explore: [["◄ Turn", () => g.turn(-1)], ["▲ Forward", () => g.move(0)], ["▼ Back", () => g.move(2)], ["Turn ►", () => g.turn(1)],
        ["Use (Space)", () => g.use()], ["Inventory (I)", () => g.openBag()], ["Map (Tab)", () => this.toggleBigMap()], ["Menu (Esc)", () => this.openDialog("#dlg-pause")]],
      combat: [["Fight (F)", () => g.combatRound("fight")], ["Cast (C)", () => g.combatRound("cast")],
        ["Potion (P)", () => g.combatRound("potion")], ["Run (R)", () => g.combatRound("run")]],
      camp: [["Merchant", () => g.openBag(true)], ["Rest (20 gold)", () => g.rest()], ["Raise the fallen", () => g.raiseDead()],
        ["Inventory", () => g.openBag()], ["Go deeper", () => g.leaveCamp()], ["Menu (Esc)", () => this.openDialog("#dlg-pause")]],
    };
    const wanted = sets[g.mode] || [];
    if (box.dataset.mode !== g.mode) {
      box.innerHTML = "";
      box.dataset.mode = g.mode;
      for (const [text, slot] of wanted) {
        const b = document.createElement("button");
        b.textContent = text;
        b.addEventListener("click", () => { slot(); });
        box.appendChild(b);
      }
    }
  }

  toggleBigMap() {
    const d = this.$("#bigmap");
    if (d.classList.contains("on")) this.closeDialogs();
    else { this.openDialog("#bigmap"); this.drawAutomap(this.$("#bigmap-canvas")); }
  }

  drawAutomap(canvas) {
    const fl = this.game.floor;
    if (!fl) return;
    const p = canvas.getContext("2d"), W = canvas.width, size = fl.grid.length, cell = W / size;
    p.fillStyle = "#E8DCC0";                                              // graph paper
    p.fillRect(0, 0, W, W);
    p.strokeStyle = "#C8B898"; p.lineWidth = 1;
    p.beginPath();
    for (let i = 0; i <= size; i++) { p.moveTo(i * cell, 0); p.lineTo(i * cell, W); p.moveTo(0, i * cell); p.lineTo(W, i * cell); }
    p.stroke();
    const colours = { chest: "#C08030", ladder: "#3060C0", monsters: "#C03030", boss: "#8030C0" };
    for (const [x, y] of fl.seen) {
      p.fillStyle = fl.grid[y][x] ? "#3A3028" : "#F8F0DC";
      p.fillRect(x * cell, y * cell, cell, cell);
      const thing = fl.things[`${x},${y}`];
      if (thing && !fl.grid[y][x]) {
        p.fillStyle = colours[thing.type];
        p.beginPath(); p.arc((x + 0.5) * cell, (y + 0.5) * cell, cell * 0.3, 0, Math.PI * 2); p.fill();
      }
    }
    const [x, y] = fl.pos, [dx, dy] = CM.DIRS[fl.facing], cx = (x + 0.5) * cell, cy = (y + 0.5) * cell;
    p.fillStyle = "#20A040";
    p.beginPath();
    p.moveTo(cx + dx * cell * 0.45, cy + dy * cell * 0.45);
    p.lineTo(cx - dy * cell * 0.35 - dx * cell * 0.3, cy + dx * cell * 0.35 - dy * cell * 0.3);
    p.lineTo(cx + dy * cell * 0.35 - dx * cell * 0.3, cy - dx * cell * 0.35 - dy * cell * 0.3);
    p.fill();
  }

  // the names and health of the foes, over the view, where they stand
  drawHud(foes, project) {
    const hud = this.$("#hud"), view = this.$("#view");
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = view.clientWidth, h = view.clientHeight;
    if (hud.width !== Math.round(w * dpr) || hud.height !== Math.round(h * dpr)) { hud.width = Math.round(w * dpr); hud.height = Math.round(h * dpr); }
    const p = hud.getContext("2d");
    p.setTransform(dpr, 0, 0, dpr, 0, 0);
    p.clearRect(0, 0, w, h);
    for (const f of foes) {
      const at = project(f.wx, f.wh, f.wz);
      if (!at) continue;
      const [sx, sy, depth] = at, bw = CM.clamp(120 / depth, 40, 110);
      p.fillStyle = "#401010"; p.fillRect(sx - bw / 2, sy - 8, bw, 6);
      p.fillStyle = "#E03030"; p.fillRect(sx - bw / 2, sy - 8, bw * Math.max(0, f.m.hp) / f.m.max, 6);
      p.font = `bold ${CM.clamp(26 / depth, 10, 14)}px Georgia`; p.textAlign = "center";
      p.fillStyle = "#000"; p.fillText(f.m.name, sx + 1, sy - 12);
      p.fillStyle = "#fff"; p.fillText(f.m.name, sx, sy - 13);
    }
  }

  fx(fx) {
    if (fx.kind === "hurt") {
      const flash = this.$("#view .hurt");
      flash.classList.add("on");
      setTimeout(() => flash.classList.remove("on"), 60);
    }
  }

  floatText(x, y, text, cls = "") {
    const el = document.createElement("div");
    el.className = "float " + cls;
    el.textContent = text;
    el.style.left = `${x}px`; el.style.top = `${y}px`;
    this.$("#floats").appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ---- the bag and the merchant ----
  _bag() {
    const g = this.game;
    const give = this.$("#bag-give");
    for (let i = 0; i < 4; i++) {
      const b = document.createElement("button");
      b.addEventListener("click", () => { this.note(g.give(this.bagRow, i)); this.fillBag(); });
      give.appendChild(b);
    }
    this.$("#btn-buy").addEventListener("click", () => { this.note(g.buy(this.shopRow)); this.fillBag(); });
    this.$("#btn-sell").addEventListener("click", () => { this.note(g.sell(this.bagRow)); this.fillBag(); });
    this.$("#btn-bag-done").addEventListener("click", () => g.closeBag());
  }

  note(text) { this.$("#bag-note").textContent = text || this.$("#bag-note").dataset.base; }

  openBag() {
    this.bagRow = this.shopRow = -1;
    this.show("bag");
    this.fillBag();
  }

  fillBag() {
    const g = this.game, shop = g.shopping;
    this.$("#bag-title").textContent = `${shop ? "The Merchant" : "Inventory"}   -   Gold: ${g.gold.toLocaleString()}`;
    this.$("#shop-list").style.display = shop ? "" : "none";
    this.$("#btn-buy").style.display = shop ? "" : "none";
    this.$("#btn-sell").style.display = shop ? "" : "none";
    const list = (el, head, items, selected, describe, onPick) => {
      el.innerHTML = `<div class="head">${head}</div>` + (items.length ? "" : `<div class="empty">Nothing here.</div>`);
      items.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "item" + (i === selected ? " sel" : "");
        row.innerHTML = `${this.esc(item.name)} <span class="what">${describe(item)}</span>`;
        row.addEventListener("click", () => { onPick(i); this.fillBag(); });
        el.appendChild(row);
      });
    };
    list(this.$("#bag-list"), "Your pack", g.bag, this.bagRow, (i) => `(${g.describe(i)}, worth ${Math.floor(i.value / 2)} gold)`, (i) => { this.bagRow = i; });
    if (shop) list(this.$("#shop-list"), "The merchant's wares", g.stock || [], this.shopRow,
      (i) => (i.kind === "weapon" || i.kind === "armor" ? `(+${i.power})  -  ${i.value} gold` : `-  ${i.value} gold`), (i) => { this.shopRow = i; });
    this.$("#bag-give").querySelectorAll("button").forEach((b, i) => {
      const m = g.party[i];
      b.textContent = `Give to ${m.cls}` + (m.hp <= 0 ? " (fallen)" : "");
    });
    const base = "Pick something from your pack, then who should equip or use it." + (shop ? "  Pick from the merchant's wares (right) to Buy." : "");
    this.$("#bag-note").dataset.base = base;
    if (!this.$("#bag-note").textContent) this.$("#bag-note").textContent = base;
  }
};

// ---- 80-main.js ----
"use strict";
// Where it all starts: the game, the window, the renderer and the sounds wired together, the keys, and the frame loop
// (real time: a frame that comes late moves the camera as far as it should have).
window.addEventListener("DOMContentLoaded", () => {
  const game = new CM.Game();
  const ui = new CM.UI(game, document.getElementById("app"));
  const renderer = new CM.Renderer(ui.canvas);
  const link = document.createElement("link");
  link.rel = "icon"; link.href = CM.art.icon();
  document.head.appendChild(link);
  CM.game = game; CM.ui = ui; CM.renderer = renderer;                 // (for the tests, and for curiosity)

  if (!renderer.ok) {
    const warn = document.createElement("div");
    warn.style.cssText = "position:fixed;left:0;right:0;top:0;padding:10px;background:#5A1010;color:#fff;font:14px Georgia;text-align:center;z-index:50";
    warn.textContent = renderer.error + " The dungeon can't be shown, but the Hall of Fame and your saves are safe.";
    document.body.appendChild(warn);
  }

  // ---- textures by depth, the floor's mesh, the camera ----
  const artCache = {};
  let themeOn = -1;
  function useTheme(number) {
    const i = CM.themeIndex(number);
    if (i === themeOn || !renderer.ok) return;
    if (!artCache[i]) artCache[i] = CM.art.build(CM.THEMES[i]);
    renderer.setTextures(artCache[i]);
    themeOn = i;
  }
  const demo = CM.makeFloor(1, "title");                                 // the corridor behind the title
  let demoCell = null;
  function showDemo() {
    useTheme(1);
    renderer.setFloor(demo, CM.THEMES[0]);
    if (!demoCell) {                                                     // a square with a long view down a corridor
      const dist = CM.distances(demo.grid, [1, 1]);
      let best = null, score = -1;
      for (const k of dist.keys()) {
        const [x, y] = k.split(",").map(Number);
        for (let f = 0; f < 4; f++) {
          let d = 0;
          while (d < 9 && demo.grid[y + CM.DIRS[f][1] * (d + 1)] && demo.grid[y + CM.DIRS[f][1] * (d + 1)][x + CM.DIRS[f][0] * (d + 1)] === 0) d++;
          if (d > score) { score = d; best = [x, y, f]; }
        }
      }
      demoCell = best || [1, 1, 2];
    }
    renderer.setCamera(demoCell[0], demoCell[1], demoCell[2]);
    renderer.setSprites([]);
  }
  game.on("floor", (floor) => {
    if (!renderer.ok) return;
    useTheme(floor.number);
    renderer.setFloor(floor, CM.themeFor(floor.number));
    renderer.setCamera(floor.pos[0], floor.pos[1], floor.facing);
  });
  game.on("moved", (x, y) => renderer.moveTo(x, y, game.settings.smooth ? 180 : 0));
  game.on("turned", (facing) => renderer.turnTo(facing, game.settings.smooth ? 160 : 0));
  game.on("mode", (mode) => {
    CM.audio.ambience(mode === "explore" || mode === "combat");
    if (mode === "title") showDemo();
    else if (game.floor && renderer.ok) {
      useTheme(game.floor.number);
      renderer.setFloor(game.floor, CM.themeFor(game.floor.number));
      renderer.setCamera(game.floor.pos[0], game.floor.pos[1], game.floor.facing);
    }
  });
  game.on("sound", (name) => CM.audio.play(name));
  const applySettings = (s) => {
    renderer.snap = !s.smooth;
    CM.audio.setEnabled(s.sound);
    CM.audio.setVolume(s.volume);
    ui.$("#view .fps").classList.toggle("on", s.fps);
  };
  game.on("settings", applySettings);
  applySettings(game.settings);

  // ---- what stands in the corridors: the floor's things, or the foes of the fight ----
  const dying = new Map();                                               // foe -> when it fell
  const flashes = new Map();                                             // foe -> flash left
  game.on("fx", (fx) => {
    if (fx.kind === "hit") flashes.set(fx.foe, 1);
    if (fx.kind === "die") dying.set(fx.foe, performance.now());
    if ((fx.kind === "hit" || fx.kind === "miss") && renderer.ok) {
      const where = foePlace(fx.foe);
      const at = where && renderer.project(where.wx, where.wh, where.wz);
      if (at) ui.floatText(at[0], at[1] - 10, fx.kind === "miss" ? "miss" : String(fx.amount), fx.kind === "miss" ? "miss" : fx.spell ? "spell" : "");
    }
  });
  game.on("mode", (mode) => { if (mode !== "combat") { dying.clear(); flashes.clear(); } });

  function foePlace(foe) {
    if (game.mode !== "combat" || !game.foeKey) return null;
    const [x, y] = game.foeKey.split(",").map(Number);
    const foes = game.foes, i = foes.indexOf(foe), n = foes.length;
    const right = [Math.cos(renderer.yaw), Math.sin(renderer.yaw)];
    const off = n === 1 ? 0 : CM.clamp((i - (n - 1) / 2) * 0.32, -0.42, 0.42);
    const back = (i % 2) * 0.12;
    const fwd = [Math.sin(renderer.yaw), -Math.cos(renderer.yaw)];
    const dx = right[0] * off + fwd[0] * back, dz = right[1] * off + fwd[1] * back;
    const big = foe.boss ? 1.25 : 0.85;
    return { x, y, dx, dz, w: big, h: big, wx: x + 0.5 + dx, wz: y + 0.5 + dz, wh: big + 0.02, m: foe };
  }

  function sprites() {
    const fl = game.floor, out = [], hud = [];
    if (!fl) return { out, hud };
    const now = performance.now();
    for (const [key, thing] of Object.entries(fl.things)) {
      const [x, y] = key.split(",").map(Number);
      if (Math.abs(x - fl.pos[0]) + Math.abs(y - fl.pos[1]) > 12) continue;
      if (thing.type === "chest") out.push({ x, y, layer: "chest", w: 0.75, h: 0.75 });
      else if (thing.type === "ladder") out.push({ x, y, layer: "hatch", w: 0.92, flat: true });
      else if ((thing.type === "monsters" || thing.type === "boss") && !(game.mode === "combat" && key === game.foeKey)) {
        const m = thing.group[0];
        out.push({ x, y, layer: `monster:${m.name}`, w: m.boss ? 1.25 : 0.85, h: m.boss ? 1.25 : 0.85 });
      }
    }
    if (game.mode === "combat") {
      for (const m of game.foes) {
        const place = foePlace(m);
        if (!place) continue;
        let alpha = 1;
        if (m.hp <= 0) {
          const t = (now - (dying.get(m) || now)) / 700;
          if (t >= 1) continue;
          alpha = 1 - t;
        } else hud.push(place);
        const flash = flashes.get(m) || 0;
        if (flash > 0) flashes.set(m, Math.max(0, flash - 0.08));
        out.push(Object.assign({ layer: `monster:${m.name}`, flash: flash * 0.8, alpha }, place));
      }
    }
    return { out, hud };
  }

  // ---- keys ----
  const held = new Set();
  const MOVES = { KeyW: ["move", 0], ArrowUp: ["move", 0], KeyS: ["move", 2], ArrowDown: ["move", 2], KeyA: ["turn", -1], ArrowLeft: ["turn", -1],
    KeyD: ["turn", 1], ArrowRight: ["turn", 1], KeyQ: ["move", 3], KeyE: ["move", 1] };
  function act(code) {
    const m = MOVES[code];
    if (!m || game.mode !== "explore") return false;
    if (m[0] === "move") game.move(m[1]); else game.turn(m[1]);
    return true;
  }
  window.addEventListener("keydown", (e) => {
    CM.audio.unlock();
    if (e.code === "F3") { e.preventDefault(); ui.toggleFps(); return; }
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
      if (e.code === "Enter" && e.target.id === "seed") ui.startNew();
      return;
    }
    if (ui.dialogOpen()) { if (e.code === "Escape" || (e.code === "Tab" && ui.$("#bigmap").classList.contains("on"))) { e.preventDefault(); ui.closeDialogs(); } return; }
    if (ui.screen === "title") {
      if (e.code === "Enter" || e.code === "Space") { e.preventDefault(); if (game.canContinue()) game.continueRun(); else ui.startNew(); }
      return;
    }
    if (ui.screen === "bag") { if (e.code === "Escape" || e.code === "KeyI") game.closeBag(); return; }
    if (e.code === "Escape") { e.preventDefault(); ui.openDialog("#dlg-pause"); return; }
    if (e.code === "Tab") { e.preventDefault(); if (game.mode !== "title") ui.toggleBigMap(); return; }
    if (game.mode === "explore") {
      if (MOVES[e.code]) { e.preventDefault(); if (!e.repeat) { held.add(e.code); if (!renderer.busy) act(e.code); } return; }
      if (e.code === "Space") { e.preventDefault(); game.use(); }
      else if (e.code === "KeyI") game.openBag();
    } else if (game.mode === "combat") {
      const a = { KeyF: "fight", KeyC: "cast", KeyP: "potion", KeyR: "run" }[e.code];
      if (a) game.combatRound(a);
    } else if (game.mode === "camp") {
      if (e.code === "KeyI") game.openBag();
    }
  });
  window.addEventListener("keyup", (e) => held.delete(e.code));
  window.addEventListener("blur", () => held.clear());
  window.addEventListener("pointerdown", () => CM.audio.unlock(), { once: false });

  // ---- the frame loop ----
  let last = performance.now(), fpsTime = 0, frames = 0, fps = 0;
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    if (renderer.ok) {
      renderer.resize();
      if (game.mode === "title") {
        renderer.yaw += dt * 0.08;                                        // a slow look around
        renderer.setSprites([]);
      } else {
        if (game.mode === "explore" && !renderer.busy && held.size) {
          for (const code of held) if (act(code)) break;                  // walking while the key is held
        }
        const { out, hud } = sprites();
        renderer.setSprites(out);
        renderer.frame(dt);
        ui.drawHud(hud, (x, y, z) => renderer.project(x, y, z));
      }
      if (game.mode === "title") renderer.frame(dt);
    }
    frames++; fpsTime += dt;
    if (fpsTime >= 0.5) { fps = Math.round(frames / fpsTime); frames = 0; fpsTime = 0; ui.$("#view .fps").textContent = `${fps} fps`; }
    requestAnimationFrame(frame);
  }
  showDemo();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
